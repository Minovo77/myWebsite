<!-- ============================================================
     【2】主应用脚本（有 id，导出时按源码提取）
     ============================================================ -->
<script id="yune-app-script">
(function () {
    'use strict';

    const FILE_KEY     = 'yune_files';
    const INSTALL_KEY  = 'yune_install';
    const CATEGORY_KEY = 'yune_categories';
    const SETTINGS_KEY = 'yune_settings';

    let files = [], installs = [], categories = [], settings = {}, isAdmin = false;

    // ---------- DOM 引用 ----------
    const $ = id => document.getElementById(id);
    const fileContainer     = $('fileContainer');
    const installGrid       = $('installGrid');
    const adminToggle       = $('adminToggle');
    const settingsBtn       = $('settingsBtn');
    const adminAddFile      = $('adminAddFile');
    const adminAddInstall   = $('adminAddInstall');
    const exportWrap        = $('exportWrap');
    const modal             = $('editModal');
    const modalTitle        = $('modalTitle');
    const modalForm         = $('modalForm');
    const editIndex         = $('editIndex');
    const modalFields       = $('modalFields');
    const modalCancel       = $('modalCancel');
    const saveBtn           = $('saveBtn');
    const addFileBtn        = $('addFileBtn');
    const addInstallBtn     = $('addInstallBtn');
    const exportBtn         = $('exportBtn');

    const settingsModal     = $('settingsModal');
    const settingsForm      = $('settingsForm');
    const settingsCancel    = $('settingsCancel');
    const sSiteName         = $('sSiteName');
    const sSubtitle         = $('sSubtitle');
    const sDescription      = $('sDescription');
    const sFooterLeft       = $('sFooterLeft');
    const sFooterRight      = $('sFooterRight');
    const sLogoFile         = $('sLogoFile');
    const logoPreviewContainer = $('logoPreviewContainer');
    const clearLogoBtn      = $('clearLogoBtn');

    const heroLogo          = $('heroLogo');
    const heroTitle         = $('heroTitle');
    const heroSub           = $('heroSub');
    const heroDesc          = $('heroDesc');
    const navBrandText      = $('navBrandText');
    const navLogo           = $('navLogo');
    const footerBrand       = $('footerBrand');
    const footerCopyright   = $('footerCopyright');

    // ---------- 数据加载 ----------
    function loadData() {
        files      = JSON.parse(localStorage.getItem(FILE_KEY)     || '[]');
        installs   = JSON.parse(localStorage.getItem(INSTALL_KEY)  || '[]');
        categories = JSON.parse(localStorage.getItem(CATEGORY_KEY) || '[]');
        settings   = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');

        files.forEach(f => {
            if (!f.fileName) f.fileName = f.name.replace(/\s/g, '_') + '.' + (f.ext || 'bin');
            if (!f.category) f.category = '其他';
        });

        const existing = new Set(categories);
        files.forEach(f => {
            if (!existing.has(f.category)) { categories.push(f.category); existing.add(f.category); }
        });

        const defaults = {
            siteName: '裕能跨境电商', subtitle: '内部资源下载（请勿外泄）',
            description: '裕能大家庭的内部资源共享网站 :)', logoData: null,
            footerLeft: '裕能跨境', footerRight: '内部资源平台 © 2026'
        };
        Object.keys(defaults).forEach(k => { if (settings[k] === undefined) settings[k] = defaults[k]; });

        saveAll();
        applySettings();
    }

    function saveAll() {
        try {
            localStorage.setItem(FILE_KEY,     JSON.stringify(files));
            localStorage.setItem(INSTALL_KEY,  JSON.stringify(installs));
            localStorage.setItem(CATEGORY_KEY, JSON.stringify(categories));
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        } catch (e) {
            if (e.name === 'QuotaExceededError' || e.code === 22) {
                alert('存储空间不足！可能是视频文件过大或数据总量超限。请删除一些旧资源或压缩视频后再试。');
            }
            throw e;
        }
    }

    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m] || m));
    }

    // ---------- 应用设置 ----------
    function applySettings() {
        if (settings.logoData && settings.logoData.length > 0) {
            heroLogo.innerHTML = `<img src="data:image/png;base64,${settings.logoData}" alt="Logo" class="hero-logo" />`;
            navLogo.src = `data:image/png;base64,${settings.logoData}`;
            navLogo.style.display = 'block';
        } else {
            const initial = settings.siteName ? settings.siteName.charAt(0) : '裕';
            heroLogo.innerHTML = `<div class="hero-logo">${initial}</div>`;
            navLogo.style.display = 'none';
        }
        heroTitle.textContent = settings.siteName || '裕能跨境电商';
        heroSub.innerHTML = `<i class="fas fa-cube"></i> ${settings.subtitle || '内部资源中心'}`;
        heroDesc.textContent = settings.description || '欢迎来到内部资源平台，汇集运营工具、数据采集插件与文档，助力高效工作。';
        const name = settings.siteName || '裕能跨境电商';
        const parts = name.split('跨境');
        navBrandText.innerHTML = parts.length > 1 ? `${parts[0]}<span>跨境</span>` : `${name}`;
        const fParts = (settings.footerLeft || '裕能跨境').split('跨境');
        footerBrand.innerHTML = fParts.length > 1 ? `${fParts[0]}<span style="color:#4A90D9;">跨境</span>` : (settings.footerLeft || '裕能跨境');
        footerCopyright.textContent = settings.footerRight || '内部资源平台 © 2026';
    }

    // ---------- 渲染 ----------
    function render() {
        // 资源区
        if (!files.length) {
            fileContainer.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><p>暂无资源</p></div>';
        } else {
            const grouped = {};
            categories.forEach(c => grouped[c] = []);
            files.forEach(f => {
                const cat = f.category || '其他';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(f);
            });
            let html = '';
            for (const [cat, items] of Object.entries(grouped)) {
                if (!items.length) continue;
                html += `<div class="category-group"><h3><i class="fas fa-folder"></i> ${escapeHtml(cat)}`;
                if (isAdmin) {
                    html += `<span class="category-actions">
                        <button data-action="renameCat" data-cat="${escapeHtml(cat)}"><i class="fas fa-edit"></i></button>
                        <button data-action="deleteCat" data-cat="${escapeHtml(cat)}"><i class="fas fa-trash"></i></button>
                    </span>`;
                }
                html += `</h3><div class="file-grid">`;
                items.forEach(f => {
                    const gi = files.indexOf(f);
                    const hasFile = f.fileData && f.fileData.length > 0;
                    html += `
                        <div class="file-card">
                            <div class="icon"><i class="fas ${f.icon||'fa-file'}"></i></div>
                            <h3>${escapeHtml(f.name)} ${hasFile ? '<span class="file-badge"><i class="fas fa-check"></i> 有文件</span>' : ''}</h3>
                            <span class="version">${escapeHtml(f.version||'v1.0')}</span>
                            <p class="desc">${escapeHtml(f.desc||'')}</p>
                            <div class="meta">
                                <span><i class="fas fa-file"></i> ${escapeHtml(f.ext||'文件')}</span>
                                <span><i class="fas fa-weight-hanging"></i> ${escapeHtml(f.size||'未知')}</span>
                            </div>
                            <button class="btn-download" data-index="${gi}">下载</button>
                            <div class="admin-controls ${isAdmin?'show':''}">
                                <button data-action="editFile" data-index="${gi}"><i class="fas fa-pen"></i> 编辑</button>
                                <button data-action="deleteFile" data-index="${gi}" class="del"><i class="fas fa-trash"></i> 删除</button>
                            </div>
                        </div>`;
                });
                html += `</div></div>`;
            }
            fileContainer.innerHTML = html;
        }

        // 安装指南区
        if (!installs.length) {
            installGrid.innerHTML = '<div class="empty"><i class="fas fa-info-circle"></i><p>暂无安装指南</p></div>';
        } else {
            let html = '';
            installs.forEach((item, i) => {
                const stepsHtml = item.steps.map(s => `<li>${s}</li>`).join('');
                const videoHtml = (item.videoData && item.videoData.length > 0)
                    ? `<video controls><source src="data:video/mp4;base64,${item.videoData}" type="video/mp4">您的浏览器不支持视频播放</video>` : '';
                html += `
                    <div class="install-card">
                        <h4><i class="fas fa-cube"></i> ${escapeHtml(item.title)}</h4>
                        ${videoHtml}
                        <ol>${stepsHtml}</ol>
                        <div class="admin-controls ${isAdmin?'show':''}" style="margin-top:10px;border-top:1px dashed #ccc;padding-top:10px;">
                            <button data-action="editInstall" data-index="${i}"><i class="fas fa-pen"></i> 编辑</button>
                            <button data-action="deleteInstall" data-index="${i}" class="del"><i class="fas fa-trash"></i> 删除</button>
                        </div>
                    </div>`;
            });
            installGrid.innerHTML = html;
        }

        adminAddFile.classList.toggle('show', isAdmin);
        adminAddInstall.classList.toggle('show', isAdmin);
        exportWrap.classList.toggle('show', isAdmin);
        settingsBtn.classList.toggle('show', isAdmin);
        adminToggle.innerHTML = isAdmin
            ? '<i class="fas fa-user-shield"></i> 退出管理'
            : '<i class="fas fa-user-shield"></i> 管理';
        adminToggle.classList.toggle('active', isAdmin);

        bindEvents();
    }

    // ---------- 事件绑定 ----------
    function bindEvents() {
        // 下载
        document.querySelectorAll('.btn-download').forEach(btn => {
            btn.onclick = function () {
                const f = files[parseInt(this.dataset.index)];
                if (!f) return;
                const fileName = f.fileName || (f.name + '.' + (f.ext || 'bin'));
                if (f.fileData && f.fileData.length > 0) {
                    try {
                        const bc = atob(f.fileData);
                        const arr = new Uint8Array(bc.length);
                        for (let i = 0; i < bc.length; i++) arr[i] = bc.charCodeAt(i);
                        download(new Blob([arr], { type: 'application/octet-stream' }), fileName);
                    } catch { alert('文件数据损坏，无法下载'); }
                } else {
                    const text = `裕能资源: ${fileName}\n（此文件未上传真实数据，仅为演示）\n时间: ${new Date().toLocaleString()}`;
                    download(new Blob([text], { type: 'application/octet-stream' }), fileName);
                }
            };
        });

        document.querySelectorAll('[data-action="editFile"]').forEach(b => b.onclick = function () { openFileForm(+this.dataset.index); });
        document.querySelectorAll('[data-action="deleteFile"]').forEach(b => b.onclick = function () {
            const idx = +this.dataset.index;
            if (confirm('删除「' + files[idx].name + '」？')) { files.splice(idx, 1); saveAll(); render(); }
        });
        document.querySelectorAll('[data-action="editInstall"]').forEach(b => b.onclick = function () { openInstallForm(+this.dataset.index); });
        document.querySelectorAll('[data-action="deleteInstall"]').forEach(b => b.onclick = function () {
            const idx = +this.dataset.index;
            if (confirm('删除「' + installs[idx].title + '」？')) { installs.splice(idx, 1); saveAll(); render(); }
        });
        document.querySelectorAll('[data-action="renameCat"]').forEach(b => b.onclick = function () {
            const oldName = this.dataset.cat;
            const newName = prompt('重命名分类「' + oldName + '」为：', oldName);
            if (newName && newName.trim() && newName.trim() !== oldName) {
                const t = newName.trim();
                if (categories.includes(t)) return alert('分类名称已存在');
                const i = categories.indexOf(oldName);
                if (i !== -1) categories[i] = t;
                files.forEach(f => { if (f.category === oldName) f.category = t; });
                saveAll(); render();
            }
        });
        document.querySelectorAll('[data-action="deleteCat"]').forEach(b => b.onclick = function () {
            const cat = this.dataset.cat;
            if (confirm('删除分类「' + cat + '」及其所有文件？')) {
                files = files.filter(f => f.category !== cat);
                const i = categories.indexOf(cat);
                if (i !== -1) categories.splice(i, 1);
                saveAll(); render();
            }
        });
    }

    function download(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    // ---------- 资源表单 ----------
    function openFileForm(index) {
        const isEdit = index >= 0 && index < files.length;
        const f = isEdit ? files[index] : { name:'', version:'', desc:'', size:'', icon:'fa-file', ext:'', category:'其他', fileData:null };
        modalTitle.textContent = isEdit ? '编辑资源' : '添加资源';
        editIndex.value = index;
        const catOptions = categories.map(c => `<option value="${escapeHtml(c)}" ${c===f.category?'selected':''}>${escapeHtml(c)}</option>`).join('');
        const hasFile = f.fileData && f.fileData.length > 0;
        modalFields.innerHTML = `
            <label>名称 *</label><input id="fName" value="${escapeHtml(f.name)}" required />
            <label>版本</label><input id="fVersion" value="${escapeHtml(f.version)}" />
            <label>大小</label><input id="fSize" value="${escapeHtml(f.size)}" />
            <label>详细介绍</label><textarea id="fDesc">${escapeHtml(f.desc)}</textarea>
            <label>图标类 (FontAwesome)</label><input id="fIcon" value="${escapeHtml(f.icon||'fa-file')}" />
            <label>文件类型</label><input id="fExt" value="${escapeHtml(f.ext)}" />
            <label>分类（文件夹）</label>
            <select id="fCategory">${catOptions}</select>
            ${isAdmin ? `<div style="margin-top:8px;"><button type="button" id="addCategoryBtn" style="background:#edf2f7;border:1px solid #ccc;border-radius:6px;padding:4px 12px;cursor:pointer;"><i class="fas fa-plus"></i> 新建分类</button></div>` : ''}
            <label>上传文件 (可选，支持多文件)</label>
            <div class="file-input-wrapper">
                <input type="file" id="fFile" multiple />
                ${hasFile ? `<p style="font-size:0.8rem;color:#4A90D9;"><i class="fas fa-check"></i> 已有文件 (${(f.fileData.length*3/4/1024).toFixed(1)} KB)，重新选择将覆盖</p>` : ''}
            </div>`;
        modal.classList.add('active');

        const addCatBtn = document.getElementById('addCategoryBtn');
        if (addCatBtn) addCatBtn.onclick = function () {
            const nc = prompt('请输入新分类名称：');
            if (nc && nc.trim()) {
                const t = nc.trim();
                if (!categories.includes(t)) {
                    categories.push(t); saveAll();
                    const sel = document.getElementById('fCategory');
                    const opt = document.createElement('option');
                    opt.value = t; opt.textContent = t; opt.selected = true;
                    sel.appendChild(opt);
                } else alert('分类已存在');
            }
        };

        modalForm.onsubmit = function (e) {
            e.preventDefault();
            const name = document.getElementById('fName').value.trim();
            if (!name) return alert('名称不能为空');
            const idx = parseInt(editIndex.value);
            const fileList = document.getElementById('fFile').files;

            const category = document.getElementById('fCategory').value || '其他';
            const icon     = document.getElementById('fIcon').value.trim() || 'fa-file';
            const ext      = document.getElementById('fExt').value.trim() || '文件';
            const version  = document.getElementById('fVersion').value.trim() || 'v1.0';
            const desc     = document.getElementById('fDesc').value.trim() || '';
            const sizeIn   = document.getElementById('fSize').value.trim();

            if (fileList.length > 1) {
                const arr = [];
                let done = 0;
                for (const file of fileList) {
                    const r = new FileReader();
                    r.onload = ev => {
                        const b64 = ev.target.result.split(',')[1];
                        const fname = file.name;
                        const fext = fname.split('.').pop().toUpperCase() + ' 文件';
                        const fsize = (file.size / 1024).toFixed(1) + ' KB';
                        arr.push({ name: fname, version, size: fsize, desc, icon, ext: fext,
                            category, fileName: fname, fileData: b64 });
                        if (++done === fileList.length) {
                            arr.forEach(nf => {
                                files.push(nf);
                                if (!categories.includes(nf.category)) categories.push(nf.category);
                            });
                            saveAll(); render(); closeModal();
                        }
                    };
                    r.readAsDataURL(file);
                }
                return;
            }

            const file = fileList[0];
            if (file) {
                const r = new FileReader();
                r.onload = ev => saveFileData(idx, ev.target.result.split(',')[1], file);
                r.onerror = () => alert('读取文件失败');
                r.readAsDataURL(file);
            } else {
                saveFileData(idx, null, null);
            }

            function saveFileData(idx, b64, file) {
                const newFile = {
                    name,
                    version,
                    size: sizeIn || (file ? (file.size/1024).toFixed(1)+' KB' : '未知'),
                    desc, icon,
                    ext: file ? file.name.split('.').pop().toUpperCase() + ' 文件' : ext,
                    category,
                    fileName: file ? file.name : (name.replace(/\s/g,'_') + '.' + (ext||'bin')),
                    fileData: b64 !== null ? b64 : (idx >= 0 && idx < files.length ? files[idx].fileData : null)
                };
                if (idx >= 0 && idx < files.length) files[idx] = newFile;
                else files.push(newFile);
                if (!categories.includes(newFile.category)) categories.push(newFile.category);
                saveAll(); render(); closeModal();
            }
        };
    }

    // ---------- 安装表单 ----------
    function openInstallForm(index) {
        const isEdit = index >= 0 && index < installs.length;
        const item = isEdit ? installs[index] : { title:'', steps:[''], videoData:null };
        modalTitle.textContent = isEdit ? '编辑安装指南' : '添加安装指南';
        editIndex.value = index;
        const hasVideo = item.videoData && item.videoData.length > 0;
        modalFields.innerHTML = `
            <label>标题 *</label><input id="iTitle" value="${escapeHtml(item.title)}" required />
            <label>步骤 (每行一个) *</label><textarea id="iSteps" rows="4">${escapeHtml(item.steps ? item.steps.join('\n') : '')}</textarea>
            <label>上传介绍视频 (MP4，建议小于 3.5MB)</label>
            <div class="file-input-wrapper">
                <input type="file" id="iVideo" accept="video/mp4" />
                ${hasVideo ? `<p style="font-size:0.8rem;color:#4A90D9;"><i class="fas fa-check"></i> 已有视频 (${(item.videoData.length*3/4/1024).toFixed(1)} KB)，重新选择将覆盖</p>` : ''}
                <div id="videoSizeHint" class="file-hint"></div>
            </div>`;
        modal.classList.add('active');

        const videoInput = document.getElementById('iVideo');
        const videoHint = document.getElementById('videoSizeHint');
        videoInput.addEventListener('change', function () {
            const file = this.files[0];
            if (!file) { videoHint.textContent = ''; return; }
            const mb = (file.size / (1024 * 1024)).toFixed(2);
            if (file.size > 3.5 * 1024 * 1024) {
                videoHint.innerHTML = `<span class="warning">⚠️ 文件过大 (${mb} MB)，建议压缩到 3.5MB 以内，否则可能无法保存。</span>`;
            } else {
                videoHint.textContent = `文件大小: ${mb} MB (可接受)`;
                videoHint.style.color = '#38a169';
            }
        });

        modalForm.onsubmit = function (e) {
            e.preventDefault();
            const title = document.getElementById('iTitle').value.trim();
            const stepsRaw = document.getElementById('iSteps').value.trim();
            if (!title) return alert('标题不能为空');
            const steps = stepsRaw.split('\n').filter(s => s.trim() !== '');
            if (!steps.length) return alert('至少填写一个步骤');

            const vFile = videoInput.files[0];
            if (vFile && vFile.size > 3.5 * 1024 * 1024) {
                if (!confirm(`视频文件较大 (${(vFile.size/(1024*1024)).toFixed(2)} MB)，可能无法保存。是否继续尝试？`)) return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            const idx = parseInt(editIndex.value);

            if (vFile) {
                const r = new FileReader();
                r.onload = ev => saveInstallData(idx, ev.target.result.split(',')[1]);
                r.onerror = () => { alert('读取视频失败'); saveBtn.disabled = false; saveBtn.textContent = '保存'; };
                r.readAsDataURL(vFile);
            } else {
                saveInstallData(idx, null);
            }

            function saveInstallData(idx, b64) {
                try {
                    const newItem = {
                        title, steps,
                        videoData: b64 !== null ? b64 : (idx >= 0 && idx < installs.length ? installs[idx].videoData : null)
                    };
                    if (idx >= 0 && idx < installs.length) installs[idx] = newItem;
                    else installs.push(newItem);
                    saveAll(); render(); closeModal();
                } catch (err) {
                    alert(err.name === 'QuotaExceededError' ? '存储空间不足！请删除一些旧资源或压缩视频后再试。' : '保存失败：' + err.message);
                    saveBtn.disabled = false; saveBtn.textContent = '保存';
                }
            }
        };
    }

    function closeModal() {
        modal.classList.remove('active');
        modalForm.onsubmit = null;
        saveBtn.disabled = false;
        saveBtn.textContent = '保存';
        const hint = document.getElementById('videoSizeHint');
        if (hint) hint.textContent = '';
    }
    modalCancel.onclick = closeModal;
    modal.onclick = e => { if (e.target === modal) closeModal(); };

    // ---------- 网站设置 ----------
    function openSettings() {
        if (!isAdmin) return alert('请先进入管理员模式');
        sSiteName.value = settings.siteName || '';
        sSubtitle.value = settings.subtitle || '';
        sDescription.value = settings.description || '';
        sFooterLeft.value = settings.footerLeft || '';
        sFooterRight.value = settings.footerRight || '';
        updateLogoPreview();
        settingsModal.classList.add('active');
    }
    function closeSettings() { settingsModal.classList.remove('active'); }
    function updateLogoPreview() {
        if (settings.logoData && settings.logoData.length > 0) {
            logoPreviewContainer.innerHTML = `<img src="data:image/png;base64,${settings.logoData}" alt="Logo 预览" class="logo-preview" />`;
        } else {
            const initial = settings.siteName ? settings.siteName.charAt(0) : '裕';
            logoPreviewContainer.innerHTML = `<div class="logo-preview-text">${initial}</div>`;
        }
    }
    settingsBtn.addEventListener('click', e => { e.preventDefault(); openSettings(); });
    settingsCancel.addEventListener('click', closeSettings);
    settingsModal.addEventListener('click', e => { if (e.target === settingsModal) closeSettings(); });

    sLogoFile.addEventListener('change', function () {
        const file = this.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = ev => { settings.logoData = ev.target.result.split(',')[1]; updateLogoPreview(); };
        r.readAsDataURL(file);
    });
    clearLogoBtn.addEventListener('click', function () {
        settings.logoData = null;
        sLogoFile.value = '';
        updateLogoPreview();
    });

    settingsForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const name = sSiteName.value.trim();
        if (!name) return alert('公司名称不能为空');
        settings.siteName    = name;
        settings.subtitle    = sSubtitle.value.trim()    || '内部资源中心';
        settings.description = sDescription.value.trim() || '欢迎来到内部资源平台，汇集运营工具、数据采集插件与文档，助力高效工作。';
        settings.footerLeft  = sFooterLeft.value.trim()  || '裕能跨境';
        settings.footerRight = sFooterRight.value.trim() || '内部资源平台 © 2026';
        saveAll(); applySettings(); closeSettings(); render();
    });

    // ---------- 按钮 ----------
    addFileBtn.addEventListener('click', () => openFileForm(-1));
    addInstallBtn.addEventListener('click', () => openInstallForm(-1));
    adminToggle.addEventListener('click', function (e) {
        e.preventDefault();
        if (!isAdmin) {
            const pwd = prompt('请输入管理员密码');
            if (pwd === 'yuneng') { isAdmin = true; render(); }
            else if (pwd !== null) alert('密码错误');
        } else {
            isAdmin = false; render();
        }
    });

    // ============================================================
    //  【修复】导出函数
    //   —— 只导出「干净的静态骨架 + 两个脚本」
    // ============================================================
    exportBtn.addEventListener('click', function () {
        // 1) 抓取样式和主脚本源码
        const style     = document.querySelector('style').innerHTML;
        const appScript = document.getElementById('yune-app-script').textContent
                            .replace(/<\/script>/gi, '<\\/script>')
                            .replace(/<\/style>/gi,  '<\\/style>');

        // 2) 克隆当前 DOM，并清理掉运行时残留
        const clone = document.body.cloneNode(true);
        clone.querySelectorAll('script').forEach(el => el.remove());
        clone.querySelectorAll('#fileContainer, #installGrid').forEach(el => el.innerHTML = '');
        clone.querySelectorAll('.admin-controls, .category-actions').forEach(el => el.remove());
        clone.querySelectorAll('.admin-add, .export-wrap, .settings-btn').forEach(el => el.classList.remove('show'));
        clone.querySelectorAll('.modal').forEach(el => el.classList.remove('active'));
        const adminBtn = clone.querySelector('#adminToggle');
        if (adminBtn) {
            adminBtn.innerHTML = '<i class="fas fa-user-shield"></i> 管理';
            adminBtn.classList.remove('active');
        }

        // 3) 生成数据播种脚本（保证导出文件首次打开就能拿到最新快照）
        const seed = `
(function () {
    localStorage.setItem('yune_files',      ${JSON.stringify(JSON.stringify(files))});
    localStorage.setItem('yune_install',    ${JSON.stringify(JSON.stringify(installs))});
    localStorage.setItem('yune_categories', ${JSON.stringify(JSON.stringify(categories))});
    localStorage.setItem('yune_settings',   ${JSON.stringify(JSON.stringify(settings))});
})();
`;

        // 4) 拼接最终 HTML
        const title = settings.siteName || '裕能跨境电商';
        const exportHtml = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>${title} · 内部资源</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>${style}</style>
</head>
<body>${clone.innerHTML}
<script>${seed}<\/script>
<script id="yune-app-script">${appScript}<\/script>
</body>
</html>`;

        download(new Blob([exportHtml], { type: 'text/html;charset=utf-8' }), 'index.html');
    });

    // ---------- 初始化 ----------
    loadData();
    render();

    document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', function (e) {
            const target = document.querySelector(this.getAttribute('href'));
            if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth' }); }
        });
    });
})();
</script>
</body>
</html>
