<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>裕能跨境电商 · 内部资源</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 完整样式（与之前一致） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f7fafc;
            color: #2d3748;
            padding-top: 64px;
            line-height: 1.6;
        }
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            z-index: 999;
        }
        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .nav-brand {
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-brand img {
            height: 36px;
            width: 36px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
        }
        .nav-brand .brand-text {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .nav-brand .brand-text span {
            color: #4A90D9;
        }
        .nav-menu {
            display: flex;
            gap: 8px;
            list-style: none;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-menu a {
            padding: 6px 14px;
            border-radius: 8px;
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
            transition: .2s;
            white-space: nowrap;
        }
        .nav-menu a:hover {
            background: rgba(74, 144, 217, 0.08);
            color: #4A90D9;
        }
        .nav-menu .admin-btn {
            background: #4A90D9;
            color: #fff !important;
            border-radius: 20px;
            padding: 6px 18px;
        }
        .nav-menu .admin-btn:hover {
            background: #357ABD;
        }
        .nav-menu .admin-btn.active {
            background: #e53e3e;
        }
        .nav-menu .admin-btn.active:hover {
            background: #c53030;
        }
        .nav-menu .settings-btn {
            display: none;
            background: #edf2f7;
            color: #2d3748 !important;
            border-radius: 20px;
            padding: 6px 14px;
            cursor: pointer;
        }
        .nav-menu .settings-btn:hover {
            background: #e2e8f0;
        }
        .nav-menu .settings-btn.show {
            display: inline-block;
        }
        .hero {
            text-align: center;
            padding: 50px 0 40px;
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        .hero-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            display: block;
            background: #4A90D9;
            color: #fff;
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 80px;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.6rem;
            font-weight: 700;
        }
        .hero .sub {
            color: #4A90D9;
            font-weight: 500;
            font-size: 1.1rem;
        }
        .hero p {
            max-width: 520px;
            margin: 10px auto 0;
            color: #4a5568;
        }
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .section-title i {
            color: #4A90D9;
            margin-right: 8px;
        }
        .section-sub {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
        }
        .downloads {
            background: #fff;
            padding: 50px 0;
        }
        .category-group {
            margin-bottom: 36px;
        }
        .category-group h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-group h3 i {
            color: #4A90D9;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .file-card {
            background: #f7fafc;
            border-radius: 14px;
            padding: 24px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            transition: .3s;
        }
        .file-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(74, 144, 217, 0.08);
        }
        .file-card .icon {
            font-size: 2.2rem;
            color: #4A90D9;
            margin-bottom: 8px;
        }
        .file-card h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }
        .file-card .version {
            color: #4A90D9;
            background: rgba(74, 144, 217, 0.08);
            padding: 0 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            display: inline-block;
            margin-bottom: 8px;
            width: fit-content;
        }
        .file-card .desc {
            color: #4a5568;
            font-size: 0.9rem;
            flex: 1;
            margin-bottom: 12px;
        }
        .file-card .meta {
            font-size: 0.8rem;
            color: #718096;
            display: flex;
            gap: 16px;
            margin-bottom: 14px;
        }
        .file-card .meta i {
            width: 18px;
        }
        .btn-download {
            background: #4A90D9;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: .25s;
            width: 100%;
        }
        .btn-download:hover {
            background: #357ABD;
        }
        .admin-controls {
            display: none;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #ccc;
        }
        .admin-controls.show {
            display: flex;
        }
        .admin-controls button {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            background: #edf2f7;
        }
        .admin-controls .del {
            background: #fff5f5;
            color: #e53e3e;
        }
        .install-guide {
            background: #f7fafc;
            padding: 50px 0;
        }
        .install-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }
        .install-card {
            background: #fff;
            border-radius: 14px;
            padding: 22px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .install-card h4 i {
            color: #4A90D9;
            margin-right: 6px;
        }
        .install-card ol {
            padding-left: 20px;
            margin-top: 8px;
            font-size: 0.9rem;
        }
        .install-card ol li::marker {
            color: #4A90D9;
            font-weight: 600;
        }
        .admin-add {
            text-align: center;
            display: none;
            margin-top: 24px;
        }
        .admin-add.show {
            display: block;
        }
        .admin-add button {
            background: #4A90D9;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .admin-add button:hover {
            background: #357ABD;
        }
        .export-wrap {
            text-align: center;
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
        }
        .export-wrap.show {
            display: block;
        }
        .export-wrap button {
            background: #2d3748;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .export-wrap button:hover {
            background: #1a202c;
        }
        .export-wrap small {
            display: block;
            margin-top: 6px;
            color: #718096;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 20px;
            max-width: 560px;
            width: 100%;
            padding: 28px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h2 {
            font-size: 1.3rem;
            margin-bottom: 16px;
        }
        .modal-box label {
            font-weight: 600;
            display: block;
            margin: 10px 0 4px;
            font-size: 0.9rem;
        }
        .modal-box input,
        .modal-box textarea,
        .modal-box select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .modal-box textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal-box .file-input-wrapper {
            margin-top: 4px;
        }
        .modal-box .file-input-wrapper input[type="file"] {
            padding: 6px 0;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-actions button {
            padding: 8px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-actions .cancel {
            background: #edf2f7;
        }
        .modal-actions .save {
            background: #4A90D9;
            color: #fff;
        }
        .footer {
            background: #1a202c;
            color: #a0aec0;
            text-align: center;
            padding: 24px 0;
            font-size: 0.9rem;
        }
        .footer .brand {
            color: #fff;
        }
        .footer .brand span {
            color: #4A90D9;
        }
        @media (max-width: 640px) {
            .nav-menu {
                gap: 4px;
            }
            .nav-menu a {
                padding: 4px 10px;
                font-size: 0.9rem;
            }
            .hero h1 {
                font-size: 2rem;
            }
            .section-title {
                font-size: 1.5rem;
            }
            .hero-logo {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
                line-height: 60px;
            }
            .nav-brand img {
                height: 28px;
                width: 28px;
            }
        }
        .empty {
            text-align: center;
            padding: 30px;
            color: #a0aec0;
            grid-column: 1 / -1;
        }
        .category-actions {
            display: inline-flex;
            gap: 8px;
            margin-left: 16px;
        }
        .category-actions button {
            background: none;
            border: none;
            color: #4A90D9;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0 4px;
        }
        .category-actions button:hover {
            text-decoration: underline;
        }
        .file-badge {
            font-size: 0.7rem;
            background: #4A90D9;
            color: #fff;
            padding: 0 8px;
            border-radius: 10px;
            display: inline-block;
            margin-left: 6px;
        }
        .logo-preview {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e2e8f0;
            margin-top: 4px;
        }
        .logo-preview-text {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #4A90D9;
            color: #fff;
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e2e8f0;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand" id="navBrand">
                <img id="navLogo" src="" alt="Logo" />
                <span class="brand-text" id="navBrandText">裕能<span>跨境</span></span>
            </div>
            <ul class="nav-menu">
                <li><a href="#home">首页</a></li>
                <li><a href="#downloads">资源下载</a></li>
                <li><a href="#install">安装指南</a></li>
                <li><a href="#" class="settings-btn" id="settingsBtn"><i class="fas fa-cog"></i> 网站设置</a></li>
                <li><a href="#" class="admin-btn" id="adminToggle"><i class="fas fa-user-shield"></i> 管理</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" id="home">
        <div class="container">
            <div id="heroLogo"></div>
            <h1 id="heroTitle">裕能跨境电商</h1>
            <div class="sub" id="heroSub"><i class="fas fa-cube"></i> 内部资源中心</div>
            <p id="heroDesc">欢迎来到内部资源平台，汇集运营工具、数据采集插件与文档，助力高效工作。</p>
        </div>
    </section>

    <section class="downloads" id="downloads">
        <div class="container">
            <h2 class="section-title"><i class="fas fa-cloud-download-alt"></i>资源下载</h2>
            <p class="section-sub">按文件夹分类展示，管理员可管理分类与资源</p>
            <div id="fileContainer"></div>
            <div class="admin-add" id="adminAddFile"><button id="addFileBtn"><i class="fas fa-plus"></i> 添加资源</button></div>
        </div>
    </section>

    <section class="install-guide" id="install">
        <div class="container">
            <h2 class="section-title"><i class="fas fa-tools"></i>安装方式</h2>
            <p class="section-sub">管理员可编辑安装说明</p>
            <div class="install-grid" id="installGrid"></div>
            <div class="admin-add" id="adminAddInstall"><button id="addInstallBtn"><i class="fas fa-plus"></i> 添加安装指南</button></div>
            <div class="export-wrap" id="exportWrap">
                <button id="exportBtn"><i class="fas fa-file-export"></i> 导出 HTML 文件</button>
                <small>导出包含所有当前数据（含上传的文件）的完整 HTML，上传 GitHub 即可同步</small>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="brand"><i class="fas fa-cube" style="color:#4A90D9;"></i> 裕能<span>跨境</span>电商</div>
            <div>内部资源平台 &copy; 2026</div>
        </div>
    </footer>

    <!-- 通用模态框（资源/安装编辑） -->
    <div class="modal" id="editModal">
        <div class="modal-box">
            <h2 id="modalTitle">编辑</h2>
            <form id="modalForm">
                <input type="hidden" id="editIndex" value="-1" />
                <div id="modalFields"></div>
                <div class="modal-actions">
                    <button type="button" class="cancel" id="modalCancel">取消</button>
                    <button type="submit" class="save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 网站设置模态框 -->
    <div class="modal" id="settingsModal">
        <div class="modal-box">
            <h2><i class="fas fa-cog"></i> 网站设置</h2>
            <form id="settingsForm">
                <label>公司名称 *</label>
                <input id="sSiteName" placeholder="裕能跨境电商" />
                <label>副标题</label>
                <input id="sSubtitle" placeholder="内部资源中心" />
                <label>介绍文字</label>
                <textarea id="sDescription" rows="3" placeholder="欢迎来到内部资源平台..."></textarea>
                <label>Logo 上传 (可选，建议 200x200)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="sLogoFile" accept="image/*" />
                </div>
                <div id="logoPreviewContainer" style="margin-top:8px;"></div>
                <div style="margin-top:8px;">
                    <button type="button" id="clearLogoBtn" style="background:#fff5f5;color:#e53e3e;border:1px solid #feb2b2;border-radius:6px;padding:4px 12px;cursor:pointer;">移除 Logo</button>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel" id="settingsCancel">取消</button>
                    <button type="submit" class="save"><i class="fas fa-save"></i> 保存设置</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // -------- 数据键名 --------
            const FILE_KEY = 'yune_files';
            const INSTALL_KEY = 'yune_install';
            const CATEGORY_KEY = 'yune_categories';
            const SETTINGS_KEY = 'yune_settings';

            // -------- 默认数据 --------
            const defaultFiles = [
                { name: '裕能Shopee运营助手', version: 'v2.0.1', desc: '一站式Shopee店铺管理工具，支持订单同步、库存预警。', size: '12.5 MB',
                    icon: 'fa-cube', ext: 'EXE', fileName: 'shopee.exe', category: '运营工具', fileData: null },
                { name: '跨境商品数据采集器', version: 'v1.3.0', desc: '高效采集Shopee、Lazada商品数据，支持CSV导出。', size: '8.2 MB',
                    icon: 'fa-database', ext: 'ZIP', fileName: 'collector.zip', category: '数据工具', fileData: null },
                { name: '多语言翻译插件', version: 'v1.0.2', desc: '一键翻译商品标题、描述，支持12种语言。', size: '2.1 MB',
                    icon: 'fa-language', ext: 'CRX', fileName: 'translate.crx', category: '运营工具', fileData: null }
            ];
            const defaultInstall = [
                { title: 'EXE 安装包', steps: ['下载 EXE 文件', '双击运行', '按向导完成安装'] },
                { title: 'ZIP 压缩包', steps: ['下载 ZIP', '解压到文件夹', '运行 setup.exe'] },
                { title: 'CRX 扩展', steps: ['下载 CRX', '打开 chrome://extensions/', '开启开发者模式，拖入安装'] }
            ];
            const defaultCategories = ['运营工具', '数据工具', '其他'];
            const defaultSettings = {
                siteName: '裕能跨境电商',
                subtitle: '内部资源中心',
                description: '欢迎来到内部资源平台，汇集运营工具、数据采集插件与文档，助力高效工作。',
                logoData: null
            };

            // -------- 状态 --------
            let files = [],
                installs = [],
                categories = [],
                settings = {},
                isAdmin = false;

            // -------- DOM 引用 --------
            const fileContainer = document.getElementById('fileContainer');
            const installGrid = document.getElementById('installGrid');
            const adminToggle = document.getElementById('adminToggle');
            const settingsBtn = document.getElementById('settingsBtn');
            const adminAddFile = document.getElementById('adminAddFile');
            const adminAddInstall = document.getElementById('adminAddInstall');
            const exportWrap = document.getElementById('exportWrap');
            const modal = document.getElementById('editModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalForm = document.getElementById('modalForm');
            const editIndex = document.getElementById('editIndex');
            const modalFields = document.getElementById('modalFields');
            const modalCancel = document.getElementById('modalCancel');
            const addFileBtn = document.getElementById('addFileBtn');
            const addInstallBtn = document.getElementById('addInstallBtn');
            const exportBtn = document.getElementById('exportBtn');

            // 设置相关 DOM
            const settingsModal = document.getElementById('settingsModal');
            const settingsForm = document.getElementById('settingsForm');
            const settingsCancel = document.getElementById('settingsCancel');
            const sSiteName = document.getElementById('sSiteName');
            const sSubtitle = document.getElementById('sSubtitle');
            const sDescription = document.getElementById('sDescription');
            const sLogoFile = document.getElementById('sLogoFile');
            const logoPreviewContainer = document.getElementById('logoPreviewContainer');
            const clearLogoBtn = document.getElementById('clearLogoBtn');

            // Hero 元素
            const heroLogo = document.getElementById('heroLogo');
            const heroTitle = document.getElementById('heroTitle');
            const heroSub = document.getElementById('heroSub');
            const heroDesc = document.getElementById('heroDesc');
            const navBrandText = document.getElementById('navBrandText');
            const navLogo = document.getElementById('navLogo');

            // -------- 数据加载与存储 --------
            function loadData() {
                const sf = localStorage.getItem(FILE_KEY);
                files = sf ? JSON.parse(sf) : JSON.parse(JSON.stringify(defaultFiles));
                const si = localStorage.getItem(INSTALL_KEY);
                installs = si ? JSON.parse(si) : JSON.parse(JSON.stringify(defaultInstall));
                const sc = localStorage.getItem(CATEGORY_KEY);
                categories = sc ? JSON.parse(sc) : JSON.parse(JSON.stringify(defaultCategories));
                const ss = localStorage.getItem(SETTINGS_KEY);
                settings = ss ? JSON.parse(ss) : JSON.parse(JSON.stringify(defaultSettings));
                // 补齐 fileName
                files.forEach(f => { if (!f.fileName) f.fileName = f.name.replace(/\s/g, '_') + '.' + (f.ext || 'bin'); });
                files.forEach(f => { if (!f.category) f.category = '其他'; });
                const existing = new Set(categories);
                files.forEach(f => { if (!existing.has(f.category)) { categories.push(f.category);
                        existing.add(f.category); } });
                // 确保 settings 有所有字段
                Object.keys(defaultSettings).forEach(k => { if (settings[k] === undefined) settings[k] = defaultSettings[k]; });
                saveAll();
                applySettings();
            }

            function saveAll() {
                localStorage.setItem(FILE_KEY, JSON.stringify(files));
                localStorage.setItem(INSTALL_KEY, JSON.stringify(installs));
                localStorage.setItem(CATEGORY_KEY, JSON.stringify(categories));
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
            }

            function escapeHtml(s) {
                if (!s) return '';
                return String(s).replace(/[&<>"']/g, function(m) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' } [m] || m;
                });
            }

            // -------- 应用设置到界面 --------
            function applySettings() {
                // Hero Logo
                if (settings.logoData && settings.logoData.length > 0) {
                    heroLogo.innerHTML =
                        `<img src="data:image/png;base64,${settings.logoData}" alt="Logo" class="hero-logo" />`;
                    navLogo.src = `data:image/png;base64,${settings.logoData}`;
                    navLogo.style.display = 'block';
                } else {
                    const initial = settings.siteName ? settings.siteName.charAt(0) : '裕';
                    heroLogo.innerHTML = `<div class="hero-logo">${initial}</div>`;
                    navLogo.style.display = 'none';
                }
                heroTitle.textContent = settings.siteName || '裕能跨境电商';
                heroSub.innerHTML = `<i class="fas fa-cube"></i> ${settings.subtitle || '内部资源中心'}`;
                heroDesc.textContent = settings.description || '欢迎来到内部资源平台，汇集运营工具、数据采集插件与文档，助力高效工作。';
                const name = settings.siteName || '裕能跨境电商';
                const parts = name.split('跨境');
                if (parts.length > 1) {
                    navBrandText.innerHTML = `${parts[0]}<span>跨境</span>`;
                } else {
                    navBrandText.innerHTML = `${name}`;
                }
                const footerBrand = document.querySelector('.footer .brand');
                if (footerBrand) {
                    const fParts = name.split('跨境');
                    if (fParts.length > 1) {
                        footerBrand.innerHTML = `<i class="fas fa-cube" style="color:#4A90D9;"></i> ${fParts[0]}<span style="color:#4A90D9;">跨境</span>`;
                    } else {
                        footerBrand.innerHTML = `<i class="fas fa-cube" style="color:#4A90D9;"></i> ${name}`;
                    }
                }
            }

            // -------- 渲染 --------
            function render() {
                if (!files.length) {
                    fileContainer.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><p>暂无资源</p></div>';
                } else {
                    const grouped = {};
                    categories.forEach(cat => { grouped[cat] = []; });
                    files.forEach(f => {
                        const cat = f.category || '其他';
                        if (!grouped[cat]) grouped[cat] = [];
                        grouped[cat].push(f);
                    });
                    let html = '';
                    for (const [cat, items] of Object.entries(grouped)) {
                        if (items.length === 0) continue;
                        html += `<div class="category-group">
                            <h3>
                                <i class="fas fa-folder"></i> ${escapeHtml(cat)}
                                ${isAdmin ? `<span class="category-actions">
                                    <button data-action="renameCat" data-cat="${escapeHtml(cat)}"><i class="fas fa-edit"></i></button>
                                    <button data-action="deleteCat" data-cat="${escapeHtml(cat)}"><i class="fas fa-trash"></i></button>
                                </span>` : ''}
                            </h3>
                            <div class="file-grid">`;
                        items.forEach((f, idx) => {
                            const globalIndex = files.indexOf(f);
                            const hasFile = f.fileData && f.fileData.length > 0;
                            html += `
                                <div class="file-card">
                                    <div class="icon"><i class="fas ${f.icon||'fa-file'}"></i></div>
                                    <h3>${escapeHtml(f.name)} ${hasFile ? '<span class="file-badge"><i class="fas fa-check"></i> 有文件</span>' : ''}</h3>
                                    <span class="version">${escapeHtml(f.version||'v1.0')}</span>
                                    <p class="desc">${escapeHtml(f.desc||'')}</p>
                                    <div class="meta">
                                        <span><i class="fas fa-file"></i> ${escapeHtml(f.ext||'文件')}</span>
                                        <span><i class="fas fa-weight-hanging"></i> ${escapeHtml(f.size||'未知')}</span>
                                    </div>
                                    <button class="btn-download" data-index="${globalIndex}">下载</button>
                                    <div class="admin-controls ${isAdmin?'show':''}">
                                        <button data-action="editFile" data-index="${globalIndex}"><i class="fas fa-pen"></i> 编辑</button>
                                        <button data-action="deleteFile" data-index="${globalIndex}" class="del"><i class="fas fa-trash"></i> 删除</button>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div></div>`;
                    }
                    fileContainer.innerHTML = html;
                }

                if (!installs.length) {
                    installGrid.innerHTML = '<div class="empty"><i class="fas fa-info-circle"></i><p>暂无安装指南</p></div>';
                } else {
                    let html = '';
                    installs.forEach((item, i) => {
                        const stepsHtml = item.steps.map(s => `<li>${s}</li>`).join('');
                        html += `
                            <div class="install-card">
                                <h4><i class="fas fa-cube"></i> ${escapeHtml(item.title)}</h4>
                                <ol>${stepsHtml}</ol>
                                <div class="admin-controls ${isAdmin?'show':''}" style="margin-top:10px;border-top:1px dashed #ccc;padding-top:10px;">
                                    <button data-action="editInstall" data-index="${i}"><i class="fas fa-pen"></i> 编辑</button>
                                    <button data-action="deleteInstall" data-index="${i}" class="del"><i class="fas fa-trash"></i> 删除</button>
                                </div>
                            </div>
                        `;
                    });
                    installGrid.innerHTML = html;
                }

                adminAddFile.classList.toggle('show', isAdmin);
                adminAddInstall.classList.toggle('show', isAdmin);
                exportWrap.classList.toggle('show', isAdmin);
                settingsBtn.classList.toggle('show', isAdmin);
                adminToggle.innerHTML = isAdmin ? '<i class="fas fa-user-shield"></i> 退出管理' : '<i class="fas fa-user-shield"></i> 管理';
                adminToggle.classList.toggle('active', isAdmin);

                document.querySelectorAll('.btn-download').forEach(btn => {
                    btn.onclick = function() {
                        const idx = parseInt(this.dataset.index);
                        const f = files[idx];
                        if (!f) return;
                        const fileName = f.fileName || (f.name + '.' + (f.ext || 'bin'));
                        if (f.fileData && f.fileData.length > 0) {
                            try {
                                const byteCharacters = atob(f.fileData);
                                const byteNumbers = new Array(byteCharacters.length);
                                for (let i = 0; i < byteCharacters.length; i++) {
                                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                                }
                                const byteArray = new Uint8Array(byteNumbers);
                                const blob = new Blob([byteArray], { type: 'application/octet-stream' });
                                const a = document.createElement('a');
                                a.href = URL.createObjectURL(blob);
                                a.download = fileName;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                setTimeout(() => URL.revokeObjectURL(a.href), 5000);
                            } catch (e) {
                                alert('文件数据损坏，无法下载');
                            }
                        } else {
                            const blob = new Blob(['裕能资源: ' + fileName + '\n（此文件未上传真实数据，仅为演示）\n时间: ' + new Date()
                                .toLocaleString()], { type: 'application/octet-stream' });
                            const a = document.createElement('a');
                            a.href = URL.createObjectURL(blob);
                            a.download = fileName;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
                        }
                    };
                });

                document.querySelectorAll('[data-action="editFile"]').forEach(btn => {
                    btn.onclick = function() { openFileForm(parseInt(this.dataset.index)); };
                });
                document.querySelectorAll('[data-action="deleteFile"]').forEach(btn => {
                    btn.onclick = function() {
                        const idx = parseInt(this.dataset.index);
                        if (confirm('删除「' + files[idx].name + '」？')) {
                            files.splice(idx, 1);
                            saveAll();
                            render();
                        }
                    };
                });

                document.querySelectorAll('[data-action="editInstall"]').forEach(btn => {
                    btn.onclick = function() { openInstallForm(parseInt(this.dataset.index)); };
                });
                document.querySelectorAll('[data-action="deleteInstall"]').forEach(btn => {
                    btn.onclick = function() {
                        const idx = parseInt(this.dataset.index);
                        if (confirm('删除「' + installs[idx].title + '」？')) {
                            installs.splice(idx, 1);
                            saveAll();
                            render();
                        }
                    };
                });

                document.querySelectorAll('[data-action="renameCat"]').forEach(btn => {
                    btn.onclick = function() {
                        const oldName = this.dataset.cat;
                        const newName = prompt('重命名分类「' + oldName + '」为：', oldName);
                        if (newName && newName.trim() && newName.trim() !== oldName) {
                            const trimmed = newName.trim();
                            if (categories.includes(trimmed)) {
                                alert('分类名称已存在');
                                return;
                            }
                            const idx = categories.indexOf(oldName);
                            if (idx !== -1) categories[idx] = trimmed;
                            files.forEach(f => { if (f.category === oldName) f.category = trimmed; });
                            saveAll();
                            render();
                        }
                    };
                });
                document.querySelectorAll('[data-action="deleteCat"]').forEach(btn => {
                    btn.onclick = function() {
                        const cat = this.dataset.cat;
                        if (confirm('删除分类「' + cat + '」及其所有文件？')) {
                            files = files.filter(f => f.category !== cat);
                            const idx = categories.indexOf(cat);
                            if (idx !== -1) categories.splice(idx, 1);
                            saveAll();
                            render();
                        }
                    };
                });
            }

            // -------- 文件表单 --------
            function openFileForm(index) {
                const isEdit = index >= 0 && index < files.length;
                const f = isEdit ? files[index] : { name: '', version: '', desc: '', size: '', icon: 'fa-file', ext: '',
                    category: '其他', fileData: null };
                modalTitle.textContent = isEdit ? '编辑资源' : '添加资源';
                editIndex.value = index;
                let catOptions = categories.map(c => `<option value="${escapeHtml(c)}" ${c===f.category?'selected':''}>${escapeHtml(c)}</option>`).join('');
                const hasFile = f.fileData && f.fileData.length > 0;
                modalFields.innerHTML = `
                    <label>名称 *</label><input id="fName" value="${escapeHtml(f.name)}" required />
                    <label>版本</label><input id="fVersion" value="${escapeHtml(f.version)}" />
                    <label>大小</label><input id="fSize" value="${escapeHtml(f.size)}" />
                    <label>详细介绍</label><textarea id="fDesc">${escapeHtml(f.desc)}</textarea>
                    <label>图标类 (FontAwesome)</label><input id="fIcon" value="${escapeHtml(f.icon||'fa-file')}" />
                    <label>文件类型</label><input id="fExt" value="${escapeHtml(f.ext)}" />
                    <label>分类（文件夹）</label>
                    <select id="fCategory">
                        ${catOptions}
                    </select>
                    ${isAdmin ? `<div style="margin-top:8px;"><button type="button" id="addCategoryBtn" style="background:#edf2f7;border:1px solid #ccc;border-radius:6px;padding:4px 12px;cursor:pointer;"><i class="fas fa-plus"></i> 新建分类</button></div>` : ''}
                    <label>上传文件 (可选)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="fFile" />
                        ${hasFile ? `<p style="font-size:0.8rem;color:#4A90D9;"><i class="fas fa-check"></i> 已有文件 (${(f.fileData.length * 3/4 / 1024).toFixed(1)} KB)，重新选择将覆盖</p>` : ''}
                    </div>
                `;
                modal.classList.add('active');

                const addCatBtn = document.getElementById('addCategoryBtn');
                if (addCatBtn) {
                    addCatBtn.onclick = function() {
                        const newCat = prompt('请输入新分类名称：');
                        if (newCat && newCat.trim()) {
                            const trimmed = newCat.trim();
                            if (!categories.includes(trimmed)) {
                                categories.push(trimmed);
                                saveAll();
                                const select = document.getElementById('fCategory');
                                const opt = document.createElement('option');
                                opt.value = trimmed;
                                opt.textContent = trimmed;
                                opt.selected = true;
                                select.appendChild(opt);
                                const options = Array.from(select.options);
                                options.sort((a, b) => a.value.localeCompare(b.value));
                                select.innerHTML = '';
                                options.forEach(o => select.appendChild(o));
                            } else {
                                alert('分类已存在');
                            }
                        }
                    };
                }

                modalForm.onsubmit = function(e) {
                    e.preventDefault();
                    const name = document.getElementById('fName').value.trim();
                    if (!name) return alert('名称不能为空');
                    const fileInput = document.getElementById('fFile');
                    const file = fileInput.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const base64 = ev.target.result.split(',')[1];
                            saveFileData(base64);
                        };
                        reader.onerror = function() { alert('读取文件失败'); };
                        reader.readAsDataURL(file);
                    } else {
                        saveFileData(null);
                    }

                    function saveFileData(base64Data) {
                        const idx = parseInt(editIndex.value);
                        const newFile = {
                            name: name,
                            version: document.getElementById('fVersion').value.trim() || 'v1.0',
                            size: document.getElementById('fSize').value.trim() || '未知',
                            desc: document.getElementById('fDesc').value.trim() || '',
                            icon: document.getElementById('fIcon').value.trim() || 'fa-file',
                            ext: document.getElementById('fExt').value.trim() || '文件',
                            category: document.getElementById('fCategory').value || '其他',
                            fileName: name.replace(/\s/g, '_') + '.' + (document.getElementById('fExt').value.trim() ||
                            'bin'),
                            fileData: base64Data !== null ? base64Data : (idx >= 0 && idx < files.length ? files[idx]
                                .fileData : null)
                        };
                        if (idx >= 0 && idx < files.length) {
                            files[idx] = newFile;
                        } else {
                            files.push(newFile);
                        }
                        if (!categories.includes(newFile.category)) {
                            categories.push(newFile.category);
                        }
                        saveAll();
                        render();
                        closeModal();
                    }
                };
            }

            // -------- 安装表单 --------
            function openInstallForm(index) {
                const isEdit = index >= 0 && index < installs.length;
                const item = isEdit ? installs[index] : { title: '', steps: [''] };
                modalTitle.textContent = isEdit ? '编辑安装指南' : '添加安装指南';
                editIndex.value = index;
                modalFields.innerHTML = `
                    <label>标题 *</label><input id="iTitle" value="${escapeHtml(item.title)}" required />
                    <label>步骤 (每行一个) *</label><textarea id="iSteps" rows="4">${escapeHtml(item.steps ? item.steps.join('\n') : '')}</textarea>
                `;
                modal.classList.add('active');
                modalForm.onsubmit = function(e) {
                    e.preventDefault();
                    const title = document.getElementById('iTitle').value.trim();
                    const stepsRaw = document.getElementById('iSteps').value.trim();
                    if (!title) return alert('标题不能为空');
                    const steps = stepsRaw.split('\n').filter(s => s.trim() !== '');
                    if (!steps.length) return alert('至少填写一个步骤');
                    const idx = parseInt(editIndex.value);
                    const newItem = { title, steps };
                    if (idx >= 0 && idx < installs.length) {
                        installs[idx] = newItem;
                    } else {
                        installs.push(newItem);
                    }
                    saveAll();
                    render();
                    closeModal();
                };
            }

            function closeModal() {
                modal.classList.remove('active');
                modalForm.onsubmit = null;
            }
            modalCancel.onclick = closeModal;
            modal.onclick = function(e) { if (e.target === modal) closeModal(); };

            // -------- 网站设置 --------
            function openSettings() {
                if (!isAdmin) {
                    alert('请先进入管理员模式');
                    return;
                }
                sSiteName.value = settings.siteName || '';
                sSubtitle.value = settings.subtitle || '';
                sDescription.value = settings.description || '';
                updateLogoPreview();
                settingsModal.classList.add('active');
            }

            function closeSettings() {
                settingsModal.classList.remove('active');
            }

            function updateLogoPreview() {
                if (settings.logoData && settings.logoData.length > 0) {
                    logoPreviewContainer.innerHTML =
                        `<img src="data:image/png;base64,${settings.logoData}" alt="Logo 预览" class="logo-preview" />`;
                } else {
                    const initial = settings.siteName ? settings.siteName.charAt(0) : '裕';
                    logoPreviewContainer.innerHTML = `<div class="logo-preview-text">${initial}</div>`;
                }
            }

            settingsBtn.addEventListener('click', function(e) {
                e.preventDefault();
                openSettings();
            });

            settingsCancel.addEventListener('click', closeSettings);
            settingsModal.addEventListener('click', function(e) { if (e.target === settingsModal) closeSettings(); });

            sLogoFile.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const base64 = ev.target.result.split(',')[1];
                        settings.logoData = base64;
                        updateLogoPreview();
                    };
                    reader.readAsDataURL(file);
                }
            });

            clearLogoBtn.addEventListener('click', function() {
                settings.logoData = null;
                sLogoFile.value = '';
                updateLogoPreview();
            });

            settingsForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const name = sSiteName.value.trim();
                if (!name) { alert('公司名称不能为空'); return; }
                settings.siteName = name;
                settings.subtitle = sSubtitle.value.trim() || '内部资源中心';
                settings.description = sDescription.value.trim() || '欢迎来到内部资源平台，汇集运营工具、数据采集插件与文档，助力高效工作。';
                saveAll();
                applySettings();
                closeSettings();
                render();
            });

            // -------- 按钮事件 --------
            addFileBtn.addEventListener('click', function() { openFileForm(-1); });
            addInstallBtn.addEventListener('click', function() { openInstallForm(-1); });

            // -------- 管理员切换（修改提示语） --------
            adminToggle.addEventListener('click', function(e) {
                e.preventDefault();
                if (!isAdmin) {
                    const pwd = prompt('请输入管理员密码');
                    if (pwd === 'yuneng') {
                        isAdmin = true;
                        render();
                    } else if (pwd !== null) {
                        alert('密码错误');
                    }
                } else {
                    isAdmin = false;
                    render();
                }
            });

            // -------- 导出 --------
            exportBtn.addEventListener('click', function() {
                const style = document.querySelector('style').innerHTML;
                const bodyHTML = document.body.innerHTML;
                const filesData = JSON.stringify(files, null, 2);
                const installData = JSON.stringify(installs, null, 2);
                const catData = JSON.stringify(categories, null, 2);
                const settingsData = JSON.stringify(settings, null, 2);
                const exportHtml = `<!DOCTYPE html>
        <html lang="zh-CN">
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
            <meta http-equiv="Pragma" content="no-cache" />
            <meta http-equiv="Expires" content="0" />
            <title>裕能跨境电商 · 内部资源</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
            <style>${style}</style>
        </head>
        <body>${bodyHTML}
        <script>
            (function() {
                const FILE_KEY = 'yune_files';
                const INSTALL_KEY = 'yune_install';
                const CATEGORY_KEY = 'yune_categories';
                const SETTINGS_KEY = 'yune_settings';
                const defaultFiles = ${filesData};
                const defaultInstall = ${installData};
                const defaultCategories = ${catData};
                const defaultSettings = ${settingsData};
                localStorage.setItem(FILE_KEY, JSON.stringify(defaultFiles));
                localStorage.setItem(INSTALL_KEY, JSON.stringify(defaultInstall));
                localStorage.setItem(CATEGORY_KEY, JSON.stringify(defaultCategories));
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(defaultSettings));
            })();
        <\/script>
        </body>
        </html>`;
                const blob = new Blob([exportHtml], { type: 'text/html;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'index.html';
                a.click();
                URL.revokeObjectURL(a.href);
            });

            // -------- 初始化 --------
            loadData();
            render();

            document.querySelectorAll('a[href^="#"]').forEach(a => {
                a.addEventListener('click', function(e) {
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) { e.preventDefault();
                        target.scrollIntoView({ behavior: 'smooth' }); }
                });
            });

        })();
    </script>
</body>
</html>
