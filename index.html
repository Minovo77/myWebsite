<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>裕能跨境电商 · 内部资源</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f7fafc;color:#2d3748;padding-top:64px;line-height:1.6}
.container{max-width:1140px;margin:0 auto;padding:0 20px}
.navbar{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.05);display:flex;align-items:center;z-index:999}
.navbar .container{display:flex;justify-content:space-between;align-items:center;width:100%}
.nav-brand{font-weight:700;font-size:1.2rem;display:flex;align-items:center;gap:10px}
.nav-brand img{height:36px;width:36px;border-radius:50%;object-fit:cover;display:none}
.nav-brand .brand-text{display:flex;align-items:center;gap:4px}
.nav-brand .brand-text span{color:#4A90D9}
.nav-menu{display:flex;gap:8px;list-style:none;align-items:center;flex-wrap:wrap}
.nav-menu a{padding:6px 14px;border-radius:8px;text-decoration:none;color:#4a5568;font-weight:500;transition:.2s;white-space:nowrap}
.nav-menu a:hover{background:rgba(74,144,217,.08);color:#4A90D9}
.nav-menu .admin-btn{background:#4A90D9;color:#fff!important;border-radius:20px;padding:6px 18px}
.nav-menu .admin-btn:hover{background:#357ABD}
.nav-menu .admin-btn.active{background:#e53e3e}
.nav-menu .admin-btn.active:hover{background:#c53030}
.nav-menu .settings-btn{display:none;background:#edf2f7;color:#2d3748!important;border-radius:20px;padding:6px 14px;cursor:pointer}
.nav-menu .settings-btn:hover{background:#e2e8f0}
.nav-menu .settings-btn.show{display:inline-block}
.hero{text-align:center;padding:50px 0 40px;background:linear-gradient(135deg,#f7fafc,#edf2f7);border-bottom:1px solid rgba(0,0,0,.04)}
.hero-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 16px;display:block;background:#4A90D9;color:#fff;font-size:2.4rem;font-weight:700;line-height:80px;text-align:center}
.hero h1{font-size:2.6rem;font-weight:700}
.hero .sub{color:#4A90D9;font-weight:500;font-size:1.1rem}
.hero p{max-width:520px;margin:10px auto 0;color:#4a5568}
.section-title{text-align:center;font-size:1.8rem;font-weight:700;margin-bottom:8px}
.section-title i{color:#4A90D9;margin-right:8px}
.section-sub{text-align:center;color:#718096;margin-bottom:30px}
.downloads{background:#fff;padding:50px 0}
.category-group{margin-bottom:36px}
.category-group h3{font-size:1.3rem;font-weight:600;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0;display:flex;align-items:center;gap:8px}
.category-group h3 i{color:#4A90D9}
.file-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.file-card{background:#f7fafc;border-radius:14px;padding:24px;border:1px solid rgba(0,0,0,.04);display:flex;flex-direction:column;transition:.3s}
.file-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(74,144,217,.08)}
.file-card .icon{font-size:2.2rem;color:#4A90D9;margin-bottom:8px}
.file-card h3{font-size:1.1rem;margin-bottom:4px}
.file-card .version{color:#4A90D9;background:rgba(74,144,217,.08);padding:0 10px;border-radius:12px;font-size:.75rem;display:inline-block;margin-bottom:8px;width:fit-content}
.file-card .desc{color:#4a5568;font-size:.9rem;flex:1;margin-bottom:12px}
.file-card .meta{font-size:.8rem;color:#718096;display:flex;gap:16px;margin-bottom:14px}
.file-card .meta i{width:18px}
.btn-download{background:#4A90D9;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:600;cursor:pointer;transition:.25s;width:100%}
.btn-download:hover{background:#357ABD}
.admin-controls{display:none;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed #ccc}
.admin-controls.show{display:flex}
.admin-controls button{flex:1;padding:6px;border:none;border-radius:6px;font-size:.8rem;font-weight:500;cursor:pointer;background:#edf2f7}
.admin-controls .del{background:#fff5f5;color:#e53e3e}
.admin-add{text-align:center;display:none;margin-top:24px}
.admin-add.show{display:block}
.admin-add button{background:#4A90D9;color:#fff;border:none;padding:12px 28px;border-radius:12px;font-weight:600;cursor:pointer}
.admin-add button:hover{background:#357ABD}
.export-wrap{text-align:center;display:none;margin-top:30px;padding-top:20px;border-top:2px dashed #e2e8f0}
.export-wrap.show{display:block}
.export-wrap button{background:#2d3748;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-weight:600;cursor:pointer}
.export-wrap button:hover{background:#1a202c}
.export-wrap small{display:block;margin-top:6px;color:#718096}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);justify-content:center;align-items:center;z-index:9999;padding:20px}
.modal.active{display:flex}
.modal-box{background:#fff;border-radius:20px;max-width:560px;width:100%;padding:28px;max-height:90vh;overflow-y:auto}
.modal-box h2{font-size:1.3rem;margin-bottom:16px}
.modal-box label{font-weight:600;display:block;margin:10px 0 4px;font-size:.9rem}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:.95rem;font-family:inherit}
.modal-box textarea{min-height:60px;resize:vertical}
.modal-box .file-input-wrapper{margin-top:4px}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.modal-actions button{padding:8px 24px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.modal-actions .cancel{background:#edf2f7}
.modal-actions .save{background:#4A90D9;color:#fff}
.footer{background:#1a202c;color:#a0aec0;text-align:center;padding:24px 0;font-size:.9rem}
.footer .brand{color:#fff}
.footer .brand span{color:#4A90D9}
.empty{text-align:center;padding:30px;color:#a0aec0;grid-column:1/-1}
.file-badge{font-size:.7rem;background:#4A90D9;color:#fff;padding:0 8px;border-radius:10px;display:inline-block;margin-left:6px}
.logo-preview,.logo-preview-text{width:64px;height:64px;border-radius:50%;border:2px solid #e2e8f0;margin-top:4px}
.logo-preview{object-fit:cover}
.logo-preview-text{background:#4A90D9;color:#fff;font-size:1.8rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.file-hint{font-size:.8rem;color:#718096;margin-top:4px}
.file-hint.warning{color:#e53e3e}
@media(max-width:640px){
.nav-menu{gap:4px}
.nav-menu a{padding:4px 10px;font-size:.9rem}
.hero h1{font-size:2rem}
.section-title{font-size:1.5rem}
.hero-logo{width:60px;height:60px;font-size:1.8rem;line-height:60px}
.nav-brand img{height:28px;width:28px}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <div class="nav-brand" id="navBrand">
      <img id="navLogo" alt="Logo">
      <span class="brand-text" id="navBrandText">裕能<span>跨境</span></span>
    </div>
    <ul class="nav-menu">
      <li><a href="#home">首页</a></li>
      <li><a href="#downloads">资源下载</a></li>
      <li><a href="#" class="settings-btn" id="settingsBtn"><i class="fas fa-cog"></i> 网站设置</a></li>
      <li><a href="#" class="admin-btn" id="adminToggle"><i class="fas fa-user-shield"></i> 管理</a></li>
    </ul>
  </div>
</nav>

<section class="hero" id="home">
  <div class="container">
    <div id="heroLogo"></div>
    <h1 id="heroTitle">裕能跨境电商</h1>
    <div class="sub" id="heroSub"><i class="fas fa-cube"></i> 内部资源下载（请勿外泄）</div>
    <p id="heroDesc">裕能大家庭的内部资源共享网站 :)</p>
  </div>
</section>

<section class="downloads" id="downloads">
  <div class="container">
    <h2 class="section-title"><i class="fas fa-cloud-download-alt"></i>资源下载</h2>
    <p class="section-sub"> 按需下载</p>
    <div id="fileContainer"></div>
    <div class="admin-add" id="adminAddFile">
      <button id="addFileBtn"><i class="fas fa-plus"></i> 添加资源</button>
    </div>
    <div class="export-wrap" id="exportWrap">
      <button id="exportBtn"><i class="fas fa-file-export"></i> 导出 HTML 文件</button>
      <small>导出包含所有当前数据（含上传的文件）的完整 HTML，上传 GitHub 即可同步</small>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="brand" id="footerBrand">裕能<span>跨境</span></div>
    <div id="footerCopyright">内部资源平台 © 2026</div>
  </div>
</footer>

<div class="modal" id="editModal">
  <div class="modal-box">
    <h2 id="modalTitle">编辑资源</h2>
    <form id="modalForm">
      <input type="hidden" id="editIndex" value="-1">
      <label>名称 *</label><input id="fName" required>
      <label>版本</label><input id="fVersion">
      <label>大小</label><input id="fSize">
      <label>详细介绍</label><textarea id="fDesc"></textarea>
      <label>图标类 (FontAwesome)</label><input id="fIcon" placeholder="例如 fa-file">
      <label>文件类型</label><input id="fExt" placeholder="例如 ZIP">
      <label>分类（文件夹）</label>
      <select id="fCategory"></select>
      <div style="margin-top:8px">
        <button type="button" id="addCategoryBtn" style="background:#edf2f7;border:1px solid #ccc;border-radius:6px;padding:4px 12px;cursor:pointer"><i class="fas fa-plus"></i> 新建分类</button>
      </div>
      <label>上传文件</label>
      <div class="file-input-wrapper"><input type="file" id="fFile"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="modalCancel">取消</button>
        <button type="submit" class="save">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2><i class="fas fa-cog"></i> 网站设置</h2>
    <form id="settingsForm">
      <label>公司名称 *</label><input id="sSiteName">
      <label>副标题</label><input id="sSubtitle">
      <label>介绍文字</label><textarea id="sDescription" rows="3"></textarea>
      <label>页脚左侧文字</label><input id="sFooterLeft">
      <label>页脚右侧文字</label><input id="sFooterRight">
      <label>Logo 上传 (可选，建议 200x200)</label>
      <div class="file-input-wrapper"><input type="file" id="sLogoFile" accept="image/*"></div>
      <div id="logoPreviewContainer" style="margin-top:8px"></div>
      <div style="margin-top:8px">
        <button type="button" id="clearLogoBtn" style="background:#fff5f5;color:#e53e3e;border:1px solid #feb2b2;border-radius:6px;padding:4px 12px;cursor:pointer">移除 Logo</button>
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="settingsCancel">取消</button>
        <button type="submit" class="save"><i class="fas fa-save"></i> 保存设置</button>
      </div>
    </form>
  </div>
</div>

  if(!localStorage.getItem('yune_files')){localStorage.setItem('yune_files','[]');}
})();
</script>

var DEFAULT_SETTINGS={siteName:'裕能跨境电商',subtitle:'内部资源下载（仅限内部使用）',description:'裕能大家庭的内部资源共享网站 :)',footerLeft:'裕能跨境',footerRight:'内部资源平台 © 2026',logo:DEFAULT_LOGO};
var DEFAULT_CATEGORIES=['运营工具','运营数据工具','特殊工具','其他'];

function $(s,r){return(r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function humanSize(b){if(!b)return'0 B';var u=['B','KB','MB','GB'],i=0;while(b>=1024&&i<3){b/=1024;i++;}return b.toFixed(2)+' '+u[i];}
function readAsDataURL(f){return new Promise(function(rs,rj){var r=new FileReader();r.onload=function(){rs(r.result);};r.onerror=rj;r.readAsDataURL(f);});}
// 判断/补全 data URL 前缀，用于修复老数据
function ensureDataURL(data,name,ext){
  if(!data)return'';
  if(/^data:/i.test(data))return data;
  var mime='application/octet-stream';
  var e=(ext||'').toLowerCase();
  var n=(name||'').toLowerCase();
  if(/\.zip$/.test(n)||e==='zip')mime='application/zip';
  else if(/\.(png)$/.test(n))mime='image/png';
  else if(/\.(jpe?g)$/.test(n))mime='image/jpeg';
  else if(/\.(gif)$/.test(n))mime='image/gif';
  else if(/\.(pdf)$/.test(n))mime='application/pdf';
  else if(/\.(txt)$/.test(n))mime='text/plain';
  return 'data:'+mime+';base64,'+data;
}

var fileContainer=$('#fileContainer'),adminAddFile=$('#adminAddFile'),adminToggle=$('#adminToggle'),settingsBtn=$('#settingsBtn');
var exportWrap=$('#exportWrap'),exportBtn=$('#exportBtn'),addFileBtn=$('#addFileBtn');
var editModal=$('#editModal'),modalTitle=$('#modalTitle'),modalForm=$('#modalForm'),modalCancel=$('#modalCancel'),editIndexInput=$('#editIndex');
var fName=$('#fName'),fVersion=$('#fVersion'),fSize=$('#fSize'),fDesc=$('#fDesc'),fIcon=$('#fIcon'),fExt=$('#fExt'),fCategory=$('#fCategory'),fFile=$('#fFile'),addCategoryBtn=$('#addCategoryBtn');
var settingsModal=$('#settingsModal'),settingsForm=$('#settingsForm'),settingsCancel=$('#settingsCancel');
var sSiteName=$('#sSiteName'),sSubtitle=$('#sSubtitle'),sDescription=$('#sDescription'),sFooterLeft=$('#sFooterLeft'),sFooterRight=$('#sFooterRight');
var sLogoFile=$('#sLogoFile'),logoPreviewContainer=$('#logoPreviewContainer'),clearLogoBtn=$('#clearLogoBtn');
var navLogo=$('#navLogo'),navBrandText=$('#navBrandText'),heroLogo=$('#heroLogo'),heroTitle=$('#heroTitle'),heroSub=$('#heroSub'),heroDesc=$('#heroDesc');
var footerBrand=$('#footerBrand'),footerCopyright=$('#footerCopyright');

var files=[],settings=Object.assign({},DEFAULT_SETTINGS),isAdmin=false,editingIndex=-1,pendingLogo=null;

function loadFiles(){try{var r=localStorage.getItem(KEY_FILES),a=r?JSON.parse(r):[];return Array.isArray(a)?a:[];}catch(e){return[];}}
function saveFiles(){try{localStorage.setItem(KEY_FILES,JSON.stringify(files));}catch(e){alert('保存失败：本地存储可能已满，请减少大文件或删除部分资源。');}}
function loadSettings(){try{var r=localStorage.getItem(KEY_SETTINGS);return r?Object.assign({},DEFAULT_SETTINGS,JSON.parse(r)):Object.assign({},DEFAULT_SETTINGS);}catch(e){return Object.assign({},DEFAULT_SETTINGS);}}
function saveSettings(){try{localStorage.setItem(KEY_SETTINGS,JSON.stringify(settings));}catch(e){alert('保存失败：本地存储可能已满。');}}

// 迁移：给老数据的 fileData 补上 data: 前缀
function migrateFiles(){
  var changed=false;
  files.forEach(function(f){
    if(f.fileData && !/^data:/i.test(f.fileData)){
      f.fileData=ensureDataURL(f.fileData,f.fileName,f.ext);
      changed=true;
    }
  });
  if(changed)saveFiles();
}

function renderSite(){
  document.title=settings.siteName+' · 内部资源';
  // Logo 和文字同时显示
  if(settings.logo){navLogo.src=settings.logo;navLogo.style.display='block';}
  else navLogo.style.display='none';
  navBrandText.style.display='flex';
  var n=settings.siteName||'裕能跨境',i=n.indexOf('跨境');
  if(i>0)navBrandText.innerHTML=esc(n.slice(0,i))+'<span>'+esc(n.slice(i))+'</span>';
  else navBrandText.textContent=n;

  if(settings.logo)heroLogo.innerHTML='<img src="'+settings.logo+'" alt="Logo" class="hero-logo">';
  else heroLogo.innerHTML='<div class="hero-logo">'+esc((settings.siteName||'Y').charAt(0))+'</div>';
  heroTitle.textContent=settings.siteName;
  heroSub.innerHTML='<i class="fas fa-cube"></i> '+esc(settings.subtitle);
  heroDesc.textContent=settings.description||'';
  footerBrand.innerHTML=esc(settings.footerLeft||'');
  footerCopyright.textContent=settings.footerRight||'';
}

function renderFiles(){
  var groups=new Map();
  files.forEach(function(f,i){var c=f.category||'其他';if(!groups.has(c))groups.set(c,[]);groups.get(c).push(Object.assign({},f,{_i:i}));});
  if(files.length===0){fileContainer.innerHTML='<div class="empty">暂无资源，请管理员添加</div>';updateCategoryOptions();return;}
  var parts=[];
  groups.forEach(function(list,cat){
    parts.push('<div class="category-group"><h3><i class="fas fa-folder-open"></i>'+esc(cat)+' <span class="file-badge">'+list.length+'</span></h3><div class="file-grid">'+list.map(renderCard).join('')+'</div></div>');
  });
  fileContainer.innerHTML=parts.join('');
  updateCategoryOptions();
}

function renderCard(f){
  var i=f._i,adminCls=isAdmin?' show':'';
  return '<div class="file-card"><div class="icon"><i class="fas '+esc(f.icon||'fa-file')+'"></i></div>'+
    '<h3>'+esc(f.name||'未命名')+'</h3>'+
    '<div class="version">'+esc(f.version||'1.0')+'</div>'+
    '<p class="desc">'+esc(f.desc||'')+'</p>'+
    '<div class="meta"><span><i class="fas fa-hdd"></i>'+esc(f.size||'')+'</span><span><i class="fas fa-file-archive"></i>'+esc(f.ext||'')+'</span></div>'+
    '<button class="btn-download" data-action="download" data-index="'+i+'"><i class="fas fa-download"></i> 下载</button>'+
    '<div class="admin-controls'+adminCls+'"><button data-action="edit" data-index="'+i+'"><i class="fas fa-edit"></i> 编辑</button><button class="del" data-action="delete" data-index="'+i+'"><i class="fas fa-trash"></i> 删除</button></div></div>';
}

function updateCategoryOptions(){
  var cats=new Set(DEFAULT_CATEGORIES);
  files.forEach(function(f){cats.add(f.category||'其他');});
  var cur=fCategory.value;
  fCategory.innerHTML=Array.from(cats).map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');
  if(cur&&cats.has(cur))fCategory.value=cur;
}

// 修复后的下载函数
function downloadFile(i){
  var f=files[i];if(!f)return;
  if(!f.fileData){alert('该资源没有上传文件。');return;}
  var data=ensureDataURL(f.fileData,f.fileName,f.ext);
  var a=document.createElement('a');
  a.href=data;
  a.download=f.fileName||((f.name||'file')+'.'+(f.ext||'zip').toLowerCase());
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function applyAdminUI(){
  adminToggle.classList.toggle('active',isAdmin);
  adminToggle.innerHTML=isAdmin?'<i class="fas fa-sign-out-alt"></i> 退出管理':'<i class="fas fa-user-shield"></i> 管理';
  adminAddFile.classList.toggle('show',isAdmin);
  exportWrap.classList.toggle('show',isAdmin);
  settingsBtn.classList.toggle('show',isAdmin);
}
function setAdmin(v){isAdmin=v;applyAdminUI();renderFiles();}

adminToggle.addEventListener('click',function(e){
  e.preventDefault();
  if(isAdmin){setAdmin(false);return;}
  var p=prompt('请输入管理员密码：');
  if(p===ADMIN_PASSWORD)setAdmin(true);
  else if(p!==null)alert('密码错误');
});

fileContainer.addEventListener('click',function(e){
  var btn=e.target.closest('[data-action]');if(!btn)return;
  var a=btn.dataset.action,idx=Number(btn.dataset.index);
  if(a==='download')downloadFile(idx);
  else if(a==='edit')openEditModal(idx);
  else if(a==='delete'){
    if(confirm('确定删除这个资源？')){files.splice(idx,1);saveFiles();renderFiles();}
  }
});

function openEditModal(i){
  editingIndex=i;
  var f=i>=0?files[i]:{name:'',version:'1.0',size:'',desc:'',icon:'fa-file',ext:'ZIP',category:'运营工具'};
  modalTitle.textContent=i>=0?'编辑资源':'添加资源';
  editIndexInput.value=i;
  fName.value=f.name||'';fVersion.value=f.version||'';fSize.value=f.size||'';
  fDesc.value=f.desc||'';fIcon.value=f.icon||'fa-file';fExt.value=f.ext||'';
  updateCategoryOptions();fCategory.value=f.category||'运营工具';
  fFile.value='';
  var w=fFile.closest('.file-input-wrapper');
  Array.from(w.querySelectorAll('.file-hint')).forEach(function(el){el.remove();});
  var h=document.createElement('p');
  var has=i>=0&&files[i].fileData;
  h.className='file-hint'+(has?'':' warning');
  h.textContent=has?('已有文件 ('+(files[i].size||'未知')+')，重新选择将覆盖'):'尚未上传文件';
  w.appendChild(h);
  editModal.classList.add('active');
}
function closeEditModal(){editModal.classList.remove('active');}

addFileBtn.addEventListener('click',function(){openEditModal(-1);});
modalCancel.addEventListener('click',closeEditModal);
editModal.addEventListener('click',function(e){if(e.target===editModal)closeEditModal();});

addCategoryBtn.addEventListener('click',function(){
  var name=prompt('请输入新分类名称：');if(!name)return;
  var exists=Array.from(fCategory.options).some(function(o){return o.value===name;});
  if(exists){fCategory.value=name;return;}
  var o=document.createElement('option');o.value=name;o.textContent=name;
  fCategory.appendChild(o);fCategory.value=name;
});

modalForm.addEventListener('submit',function(e){
  e.preventDefault();
  var entry={name:fName.value.trim(),version:fVersion.value.trim(),size:fSize.value.trim(),desc:fDesc.value.trim(),icon:fIcon.value.trim()||'fa-file',ext:fExt.value.trim(),category:fCategory.value};
  if(!entry.name){alert('名称不能为空');return;}
  var file=fFile.files[0];
  if(file){
    readAsDataURL(file).then(function(data){
      entry.fileData=data;entry.fileName=file.name;
      if(!entry.size)entry.size=humanSize(file.size);
      if(editingIndex>=0)files[editingIndex]=entry;else files.push(entry);
      saveFiles();renderFiles();closeEditModal();
    }).catch(function(){alert('读取文件失败');});
  }else{
    if(editingIndex>=0&&files[editingIndex].fileData){entry.fileData=files[editingIndex].fileData;entry.fileName=files[editingIndex].fileName;}
    if(editingIndex>=0)files[editingIndex]=entry;else files.push(entry);
    saveFiles();renderFiles();closeEditModal();
  }
});

function openSettings(){
  sSiteName.value=settings.siteName;sSubtitle.value=settings.subtitle;
  sDescription.value=settings.description;sFooterLeft.value=settings.footerLeft;
  sFooterRight.value=settings.footerRight;sLogoFile.value='';
  pendingLogo=settings.logo||null;renderLogoPreview();
  settingsModal.classList.add('active');
}
function closeSettings(){settingsModal.classList.remove('active');}
function renderLogoPreview(){
  if(pendingLogo)logoPreviewContainer.innerHTML='<img src="'+pendingLogo+'" class="logo-preview" alt="Logo">';
  else logoPreviewContainer.innerHTML='<div class="logo-preview-text">'+esc((sSiteName.value||'Y').charAt(0))+'</div>';
}

settingsBtn.addEventListener('click',function(e){e.preventDefault();openSettings();});
settingsCancel.addEventListener('click',closeSettings);
settingsModal.addEventListener('click',function(e){if(e.target===settingsModal)closeSettings();});

sLogoFile.addEventListener('change',function(){
  var f=sLogoFile.files[0];if(!f)return;
  readAsDataURL(f).then(function(d){pendingLogo=d;renderLogoPreview();}).catch(function(){alert('读取 Logo 失败');});
});
clearLogoBtn.addEventListener('click',function(){pendingLogo=null;sLogoFile.value='';renderLogoPreview();});

settingsForm.addEventListener('submit',function(e){
  e.preventDefault();
  settings.siteName=sSiteName.value.trim()||DEFAULT_SETTINGS.siteName;
  settings.subtitle=sSubtitle.value.trim();
  settings.description=sDescription.value.trim();
  settings.footerLeft=sFooterLeft.value.trim();
  settings.footerRight=sFooterRight.value.trim();
  settings.logo=pendingLogo||'';
  saveSettings();renderSite();closeSettings();
});

exportBtn.addEventListener('click',function(){
  var clone=document.documentElement.cloneNode(true);
  Array.from(clone.querySelectorAll('.modal.active')).forEach(function(el){el.classList.remove('active');});
  Array.from(clone.querySelectorAll('.file-hint')).forEach(function(el){el.remove();});
  var fc=clone.querySelector('#fileContainer');if(fc)fc.innerHTML='';
  var lpc=clone.querySelector('#logoPreviewContainer');if(lpc)lpc.innerHTML='';
  var nl=clone.querySelector('#navLogo');if(nl)nl.removeAttribute('src');
  var filesRaw=localStorage.getItem(KEY_FILES)||'[]';
  var settingsRaw=localStorage.getItem(KEY_SETTINGS)||'{}';
  var seed=clone.querySelector('#seedScript');
  if(seed){
    seed.textContent="(function(){\n  if(!localStorage.getItem("+JSON.stringify(KEY_FILES)+")){localStorage.setItem("+JSON.stringify(KEY_FILES)+","+JSON.stringify(filesRaw)+");}\n  if(!localStorage.getItem("+JSON.stringify(KEY_SETTINGS)+")){localStorage.setItem("+JSON.stringify(KEY_SETTINGS)+","+JSON.stringify(settingsRaw)+");}\n})();";
  }
  var html='<!DOCTYPE html>\n'+clone.outerHTML;
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='index.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
});

files=loadFiles();
settings=loadSettings();
migrateFiles();   // ← 一次性修复老的 base64 数据
applyAdminUI();
renderSite();
renderFiles();
})();
</script>
</body>
</html>
