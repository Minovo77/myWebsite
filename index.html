<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>裕能跨境电商 · 内部资源管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7fafc;
            color: #2d3748;
            line-height: 1.6;
            padding-top: 64px;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            height: 64px;
            display: flex;
            align-items: center;
            transition: box-shadow 0.3s;
        }
        .navbar.scrolled {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .nav-brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-brand i {
            color: #4A90D9;
            font-size: 1.4rem;
        }
        .nav-brand span {
            color: #4A90D9;
        }
        .nav-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .nav-toggle:hover {
            background: rgba(0, 0, 0, 0.04);
        }
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 8px;
            align-items: center;
        }
        .nav-menu li a {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #4a5568;
            transition: all 0.2s;
            position: relative;
        }
        .nav-menu li a::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: #4A90D9;
            border-radius: 2px;
            transition: width 0.25s;
        }
        .nav-menu li a:hover {
            color: #4A90D9;
            background: rgba(74, 144, 217, 0.06);
        }
        .nav-menu li a:hover::after {
            width: 60%;
        }
        .nav-menu li a.active {
            color: #4A90D9;
            background: rgba(74, 144, 217, 0.08);
        }
        .nav-menu li a.active::after {
            width: 60%;
        }
        .nav-admin-btn {
            background: #4A90D9;
            color: #fff !important;
            border-radius: 20px !important;
            padding: 6px 18px !important;
            font-weight: 600 !important;
        }
        .nav-admin-btn::after {
            display: none !important;
        }
        .nav-admin-btn:hover {
            background: #357ABD !important;
            color: #fff !important;
            transform: scale(1.04);
        }
        .nav-admin-btn.admin-active {
            background: #e53e3e !important;
        }
        .nav-admin-btn.admin-active:hover {
            background: #c53030 !important;
        }

        /* ===== Hero 区 (无头像) ===== */
        .hero {
            padding: 60px 0 50px;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .hero .subtitle {
            font-size: 1.15rem;
            color: #4A90D9;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .hero .subtitle i {
            margin: 0 6px;
            opacity: 0.5;
            font-size: 0.7rem;
            vertical-align: middle;
        }
        .hero .bio {
            max-width: 580px;
            margin: 0 auto;
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.7;
        }
        .hero .bio strong {
            color: #2d3748;
        }

        /* ===== 通用标题 ===== */
        .section-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .section-sub {
            text-align: center;
            color: #718096;
            font-size: 1rem;
            margin-bottom: 40px;
        }

        /* ===== 下载中心 ===== */
        .downloads {
            padding: 60px 0 50px;
            background: #ffffff;
        }
        .downloads .section-title i {
            color: #4A90D9;
            margin-right: 8px;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
        }
        .file-card {
            background: #f7fafc;
            border-radius: 16px;
            padding: 28px 24px 24px;
            transition: all 0.3s;
            border: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
        }
        .file-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(74, 144, 217, 0.10);
            border-color: rgba(74, 144, 217, 0.15);
            background: #ffffff;
        }
        .file-icon {
            font-size: 2.6rem;
            color: #4A90D9;
            margin-bottom: 12px;
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: rgba(74, 144, 217, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .file-card h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 4px;
        }
        .file-card .file-version {
            font-size: 0.8rem;
            color: #4A90D9;
            font-weight: 500;
            background: rgba(74, 144, 217, 0.08);
            padding: 0 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 8px;
            width: fit-content;
        }
        .file-card .file-desc {
            color: #4a5568;
            font-size: 0.92rem;
            line-height: 1.6;
            flex: 1;
            margin-bottom: 16px;
        }
        .file-meta {
            display: flex;
            gap: 16px;
            font-size: 0.82rem;
            color: #718096;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .file-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .file-meta i {
            color: #4A90D9;
            width: 16px;
        }
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #4A90D9;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            width: 100%;
            margin-top: auto;
        }
        .btn-download:hover {
            background: #357ABD;
            transform: scale(1.01);
            box-shadow: 0 6px 20px rgba(74, 144, 217, 0.30);
        }
        .btn-download.loading {
            opacity: 0.7;
            pointer-events: none;
        }
        .btn-download .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-download.loading .spinner {
            display: inline-block;
        }
        .btn-download.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 管理员控制（文件） ===== */
        .admin-controls {
            display: none;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed rgba(0, 0, 0, 0.08);
        }
        .admin-controls.show {
            display: flex;
        }
        .admin-controls button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-edit-file {
            background: #edf2f7;
            color: #2d3748;
        }
        .btn-edit-file:hover {
            background: #e2e8f0;
        }
        .btn-delete-file {
            background: #fff5f5;
            color: #e53e3e;
        }
        .btn-delete-file:hover {
            background: #fed7d7;
        }
        .btn-add-file {
            background: #4A90D9;
            color: #fff;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 20px auto 0;
        }
        .btn-add-file:hover {
            background: #357ABD;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(74, 144, 217, 0.25);
        }
        .admin-add-wrapper {
            text-align: center;
            display: none;
        }
        .admin-add-wrapper.show {
            display: block;
        }

        /* ===== 安装指南 ===== */
        .install-guide {
            padding: 60px 0 50px;
            background: #f7fafc;
        }
        .install-guide .section-title i {
            color: #4A90D9;
            margin-right: 8px;
        }
        .install-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
        }
        .install-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px 22px 22px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }
        .install-card:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }
        .install-card h4 {
            font-size: 1rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .install-card h4 i {
            color: #4A90D9;
            font-size: 1.1rem;
        }
        .install-card ol {
            padding-left: 20px;
            color: #4a5568;
            font-size: 0.9rem;
            line-height: 1.8;
            flex: 1;
            margin-bottom: 12px;
        }
        .install-card ol li::marker {
            color: #4A90D9;
            font-weight: 600;
        }

        /* 安装卡片管理按钮 */
        .install-admin-controls {
            display: none;
            gap: 8px;
            margin-top: 8px;
            padding-top: 14px;
            border-top: 1px dashed rgba(0, 0, 0, 0.08);
        }
        .install-admin-controls.show {
            display: flex;
        }
        .install-admin-controls button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #edf2f7;
            color: #2d3748;
        }
        .install-admin-controls button:hover {
            background: #e2e8f0;
        }
        .install-admin-controls .btn-delete-install {
            background: #fff5f5;
            color: #e53e3e;
        }
        .install-admin-controls .btn-delete-install:hover {
            background: #fed7d7;
        }

        .btn-add-install {
            background: #4A90D9;
            color: #fff;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 20px auto 0;
        }
        .btn-add-install:hover {
            background: #357ABD;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(74, 144, 217, 0.25);
        }
        .admin-add-install-wrapper {
            text-align: center;
            display: none;
        }
        .admin-add-install-wrapper.show {
            display: block;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 24px;
            max-width: 580px;
            width: 100%;
            padding: 32px 28px;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.15);
            animation: fadeUp 0.3s;
        }
        @keyframes fadeUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-box h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-box h2 i {
            color: #4A90D9;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #2d3748;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: border 0.2s;
            background: #f7fafc;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4A90D9;
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.15);
            background: #fff;
        }
        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }
        .form-row {
            display: flex;
            gap: 16px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 10px 28px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-modal-cancel {
            background: #edf2f7;
            color: #4a5568;
        }
        .btn-modal-cancel:hover {
            background: #e2e8f0;
        }
        .btn-modal-save {
            background: #4A90D9;
            color: #fff;
        }
        .btn-modal-save:hover {
            background: #357ABD;
        }

        /* ===== 页脚 ===== */
        .footer {
            background: #1a202c;
            color: #a0aec0;
            padding: 28px 0;
            text-align: center;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .footer .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .footer .brand {
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .footer .brand span {
            color: #4A90D9;
        }
        .footer .author {
            color: #718096;
            font-size: 0.85rem;
        }
        .footer .author i {
            color: #4A90D9;
            margin: 0 4px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 3rem;
            color: #cbd5e0;
            margin-bottom: 12px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .nav-toggle {
                display: block;
            }
            .nav-menu {
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(12px);
                flex-direction: column;
                padding: 12px 0 18px;
                gap: 0;
                border-bottom: 1px solid rgba(0, 0, 0, 0.06);
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
                transform: translateY(-120%);
                opacity: 0;
                transition: all 0.35s;
                pointer-events: none;
            }
            .nav-menu.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
            .nav-menu li a {
                display: block;
                padding: 12px 24px;
                font-size: 1rem;
                border-radius: 0;
                text-align: center;
            }
            .nav-menu li a::after {
                display: none;
            }
            .nav-admin-btn {
                border-radius: 0 !important;
                background: transparent !important;
                color: #4a5568 !important;
                font-weight: 500 !important;
            }
            .nav-admin-btn:hover {
                background: rgba(74, 144, 217, 0.06) !important;
                transform: none !important;
            }
            .nav-admin-btn.admin-active {
                color: #e53e3e !important;
                background: transparent !important;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .hero .subtitle {
                font-size: 1rem;
            }
            .hero .bio {
                font-size: 0.95rem;
                padding: 0 8px;
            }
            .section-title {
                font-size: 1.6rem;
            }
            .file-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .install-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .modal-box {
                padding: 24px 18px;
            }
        }
        @media (max-width: 480px) {
            .container {
                padding: 0 16px;
            }
            .hero {
                padding: 40px 0 32px;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .hero .subtitle {
                font-size: 0.9rem;
            }
            .file-card {
                padding: 20px 16px 18px;
            }
            .btn-download {
                font-size: 0.9rem;
                padding: 10px 16px;
            }
            .section-title {
                font-size: 1.4rem;
            }
            .nav-brand {
                font-size: 1.05rem;
            }
        }
        @media (min-width: 1200px) {
            .file-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .install-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- ===== 导航栏 ===== -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="nav-brand">
                <i class="fas fa-cube"></i>
                裕能<span>跨境</span>
            </div>
            <button class="nav-toggle" id="navToggle" aria-label="切换菜单">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="#home" class="active">首页</a></li>
                <li><a href="#downloads">资源下载</a></li>
                <li><a href="#install">安装指南</a></li>
                <li><a href="#downloads" class="nav-admin-btn" id="adminToggleBtn"><i class="fas fa-user-shield"></i> 管理</a></li>
            </ul>
        </div>
    </nav>

    <!-- ===== Hero 区（无头像） ===== -->
    <section class="hero" id="home">
        <div class="container">
            <h1>裕能跨境电商</h1>
            <div class="subtitle">
                <i class="fas fa-cube"></i>
                内部资源中心
                <i class="fas fa-cube"></i>
            </div>
            <p class="bio">
                欢迎来到 <strong>裕能跨境电商</strong> 内部资源平台 🚀<br />
                这里汇集了团队日常所需的运营工具、数据采集插件与文档，
                助力每一位伙伴高效工作，轻松出海。
            </p>
        </div>
    </section>

    <!-- ===== 下载中心 ===== -->
    <section class="downloads" id="downloads">
        <div class="container">
            <h2 class="section-title"><i class="fas fa-cloud-download-alt"></i>资源下载</h2>
            <p class="section-sub">点击下载按钮获取工具，管理员可上传或编辑资源介绍</p>
            <div class="file-grid" id="fileGrid"></div>
            <div class="admin-add-wrapper" id="adminAddWrapper">
                <button class="btn-add-file" id="openAddModalBtn"><i class="fas fa-plus-circle"></i> 上传新资源</button>
            </div>
        </div>
    </section>

    <!-- ===== 安装指南 ===== -->
    <section class="install-guide" id="install">
        <div class="container">
            <h2 class="section-title"><i class="fas fa-tools"></i>安装方式</h2>
            <p class="section-sub">按照以下步骤完成工具安装，管理员可增删或编辑安装说明</p>
            <div class="install-grid" id="installGrid"></div>
            <div class="admin-add-install-wrapper" id="adminAddInstallWrapper">
                <button class="btn-add-install" id="openAddInstallModalBtn"><i class="fas fa-plus-circle"></i> 添加安装指南</button>
            </div>
        </div>
    </section>

    <!-- ===== 页脚 ===== -->
    <footer class="footer">
        <div class="container">
            <div class="brand">
                <i class="fas fa-cube" style="color:#4A90D9;"></i>
                裕能<span style="color:#4A90D9;">跨境</span>电商
            </div>
            <div class="author">
                <i class="fas fa-code"></i>
                内部资源平台 &copy; 2026 裕能跨境电商
            </div>
        </div>
    </footer>

    <!-- ===== 模态框：文件 ===== -->
    <div class="modal-overlay" id="fileModal">
        <div class="modal-box">
            <h2 id="fileModalTitle"><i class="fas fa-edit"></i> 编辑资源</h2>
            <form id="fileForm" autocomplete="off">
                <input type="hidden" id="fileEditIndex" value="-1" />
                <div class="form-group">
                    <label for="fileName">资源名称 *</label>
                    <input type="text" id="fileName" placeholder="例如：Shopee 运营助手" required />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fileVersion">版本</label>
                        <input type="text" id="fileVersion" placeholder="v2.0.1" />
                    </div>
                    <div class="form-group">
                        <label for="fileSize">文件大小</label>
                        <input type="text" id="fileSize" placeholder="12.5 MB" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="fileDesc">详细介绍 *</label>
                    <textarea id="fileDesc" placeholder="请描述工具功能、适用场景…" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fileIcon">图标 (FontAwesome类名)</label>
                        <input type="text" id="fileIcon" placeholder="fa-cube" value="fa-cube" />
                    </div>
                    <div class="form-group">
                        <label for="fileExt">文件类型</label>
                        <input type="text" id="fileExt" placeholder="EXE / ZIP / CRX" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="fileUpload">上传文件 (模拟)</label>
                    <input type="file" id="fileUpload" />
                    <small style="color:#718096; font-size:0.8rem;">选择文件仅用于模拟，实际将存储元数据</small>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" id="fileModalCancel">取消</button>
                    <button type="submit" class="btn-modal-save"><i class="fas fa-save"></i> 保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== 模态框：安装指南 ===== -->
    <div class="modal-overlay" id="installModal">
        <div class="modal-box">
            <h2 id="installModalTitle"><i class="fas fa-edit"></i> 编辑安装说明</h2>
            <form id="installForm" autocomplete="off">
                <input type="hidden" id="installEditIndex" value="-1" />
                <div class="form-group">
                    <label for="installTitle">标题 *</label>
                    <input type="text" id="installTitle" placeholder="例如：通用 EXE 安装包" required />
                </div>
                <div class="form-group">
                    <label for="installSteps">步骤 (每行一个步骤) *</label>
                    <textarea id="installSteps" rows="6" placeholder="1. 下载文件&#10;2. 双击运行&#10;3. 完成安装" required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" id="installModalCancel">取消</button>
                    <button type="submit" class="btn-modal-save"><i class="fas fa-save"></i> 保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- JavaScript -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- 数据 ----------
            const FILE_STORAGE = 'yune_cb_files';
            const INSTALL_STORAGE = 'yune_cb_install';

            const defaultFiles = [{
                name: '裕能Shopee运营助手',
                version: 'v2.0.1',
                desc: '一站式Shopee店铺管理工具，支持订单同步、库存预警、数据看板，大幅提升运营效率。',
                size: '12.5 MB',
                icon: 'fa-cube',
                ext: 'EXE 安装包',
                fileName: '裕能Shopee运营助手_v2.0.1.exe'
            }, {
                name: '跨境商品数据采集器',
                version: 'v1.3.0',
                desc: '高效采集 Shopee、Lazada 等平台商品数据，支持多维度筛选与 CSV 导出，选品更轻松。',
                size: '8.2 MB',
                icon: 'fa-database',
                ext: 'ZIP 压缩包',
                fileName: '跨境商品数据采集器_v1.3.0.zip'
            }, {
                name: '多语言翻译插件',
                version: 'v1.0.2',
                desc: '一键翻译商品标题、描述与详情，支持 12 种语言，帮助您快速拓展东南亚市场。',
                size: '2.1 MB',
                icon: 'fa-language',
                ext: 'CRX 扩展',
                fileName: '多语言翻译插件_v1.0.2.crx'
            }];

            const defaultInstall = [{
                title: '通用 EXE 安装包',
                icon: 'fa-cube',
                steps: [
                    '下载 <strong>EXE 安装包</strong> 到本地',
                    '双击运行安装程序，点击「下一步」',
                    '选择安装目录（默认即可），继续安装',
                    '安装完成后，桌面生成快捷方式，双击启动'
                ]
            }, {
                title: 'ZIP 压缩包工具',
                icon: 'fa-archive',
                steps: [
                    '下载 <strong>ZIP 压缩包</strong> 并解压',
                    '进入解压文件夹，运行 <code>setup.exe</code> 或 <code>start.bat</code>',
                    '按向导完成配置（数据库连接等）',
                    '启动工具，登录后即可使用'
                ]
            }, {
                title: '浏览器扩展 (CRX)',
                icon: 'fa-puzzle-piece',
                steps: [
                    '下载 <strong>CRX 文件</strong> 到本地',
                    '打开 Chrome 浏览器，进入 <code>chrome://extensions/</code>',
                    '开启右上角「开发者模式」',
                    '将 CRX 文件拖入页面，点击「添加扩展」'
                ]
            }];

            // 状态
            let files = [];
            let installs = [];
            let isAdmin = false;

            // DOM 引用
            const fileGrid = document.getElementById('fileGrid');
            const installGrid = document.getElementById('installGrid');
            const adminToggleBtn = document.getElementById('adminToggleBtn');
            const adminAddWrapper = document.getElementById('adminAddWrapper');
            const adminAddInstallWrapper = document.getElementById('adminAddInstallWrapper');

            // 文件模态框
            const fileModal = document.getElementById('fileModal');
            const fileModalTitle = document.getElementById('fileModalTitle');
            const fileEditIndex = document.getElementById('fileEditIndex');
            const fileForm = document.getElementById('fileForm');
            const fileName = document.getElementById('fileName');
            const fileVersion = document.getElementById('fileVersion');
            const fileSize = document.getElementById('fileSize');
            const fileDesc = document.getElementById('fileDesc');
            const fileIcon = document.getElementById('fileIcon');
            const fileExt = document.getElementById('fileExt');
            const fileUpload = document.getElementById('fileUpload');
            const fileModalCancel = document.getElementById('fileModalCancel');
            const openAddFileBtn = document.getElementById('openAddModalBtn');

            // 安装模态框
            const installModal = document.getElementById('installModal');
            const installModalTitle = document.getElementById('installModalTitle');
            const installEditIndex = document.getElementById('installEditIndex');
            const installForm = document.getElementById('installForm');
            const installTitle = document.getElementById('installTitle');
            const installSteps = document.getElementById('installSteps');
            const installModalCancel = document.getElementById('installModalCancel');
            const openAddInstallBtn = document.getElementById('openAddInstallModalBtn');

            // ---------- 工具 ----------
            function loadData() {
                // 文件
                const storedFiles = localStorage.getItem(FILE_STORAGE);
                if (storedFiles) {
                    try {
                        files = JSON.parse(storedFiles);
                        if (!Array.isArray(files) || files.length === 0) files = JSON.parse(JSON.stringify(defaultFiles));
                    } catch { files = JSON.parse(JSON.stringify(defaultFiles)); }
                } else {
                    files = JSON.parse(JSON.stringify(defaultFiles));
                }
                files.forEach(f => {
                    if (!f.fileName) {
                        f.fileName = f.name.replace(/\s/g, '_') + '_' + (f.version || 'v1.0') + '.' + (f.ext || 'bin');
                    }
                });
                saveFiles();

                // 安装
                const storedInstall = localStorage.getItem(INSTALL_STORAGE);
                if (storedInstall) {
                    try {
                        installs = JSON.parse(storedInstall);
                        if (!Array.isArray(installs) || installs.length === 0) installs = JSON.parse(JSON.stringify(
                            defaultInstall));
                    } catch { installs = JSON.parse(JSON.stringify(defaultInstall)); }
                } else {
                    installs = JSON.parse(JSON.stringify(defaultInstall));
                }
                saveInstall();
            }

            function saveFiles() {
                localStorage.setItem(FILE_STORAGE, JSON.stringify(files));
            }

            function saveInstall() {
                localStorage.setItem(INSTALL_STORAGE, JSON.stringify(installs));
            }

            function escapeHtml(text) {
                if (!text) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return String(text).replace(/[&<>"']/g, m => map[m]);
            }

            // ---------- 渲染 ----------
            function renderFiles() {
                if (files.length === 0) {
                    fileGrid.innerHTML =
                        `<div class="empty-state"><i class="fas fa-inbox"></i><p>暂无资源，点击「上传新资源」添加。</p></div>`;
                    return;
                }
                let html = '';
                files.forEach((f, idx) => {
                    html += `
                        <div class="file-card" data-index="${idx}">
                            <div class="file-icon"><i class="fas ${f.icon || 'fa-file'}"></i></div>
                            <h3>${escapeHtml(f.name)}</h3>
                            <span class="file-version">${escapeHtml(f.version || 'v1.0')}</span>
                            <p class="file-desc">${escapeHtml(f.desc || '暂无描述')}</p>
                            <div class="file-meta">
                                <span><i class="fas fa-file"></i> ${escapeHtml(f.ext || '文件')}</span>
                                <span><i class="fas fa-weight-hanging"></i> ${escapeHtml(f.size || '未知')}</span>
                                <span><i class="fas fa-calendar-alt"></i> 2026-09-07</span>
                            </div>
                            <button class="btn-download" data-filename="${escapeHtml(f.fileName || f.name)}">
                                <span class="btn-text"><i class="fas fa-download"></i> 下载</span>
                                <span class="spinner"></span>
                            </button>
                            <div class="admin-controls ${isAdmin ? 'show' : ''}">
                                <button class="btn-edit-file" data-index="${idx}"><i class="fas fa-pen"></i> 编辑</button>
                                <button class="btn-delete-file" data-index="${idx}"><i class="fas fa-trash"></i> 删除</button>
                            </div>
                        </div>
                    `;
                });
                fileGrid.innerHTML = html;

                // 下载事件
                document.querySelectorAll('.file-card .btn-download').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        if (this.classList.contains('loading')) return;
                        const fn = this.getAttribute('data-filename') || 'file.bin';
                        this.classList.add('loading');
                        const delay = 1800 + Math.random() * 1400;
                        const that = this;
                        setTimeout(() => {
                            try {
                                const blob = new Blob(
                                    ['裕能跨境电商资源: ' + fn + '\n下载时间: ' + new Date().toLocaleString()],
                                    { type: 'application/octet-stream' }
                                );
                                const url = URL.createObjectURL(blob);
                                const link = document.createElement('a');
                                link.href = url;
                                link.download = fn;
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                                setTimeout(() => URL.revokeObjectURL(url), 5000);
                            } catch (err) {
                                window.open('#', '_blank');
                            }
                            that.classList.remove('loading');
                            const txt = that.querySelector('.btn-text');
                            if (txt) {
                                txt.innerHTML = '<i class="fas fa-check"></i> 已下载';
                                setTimeout(() => { txt.innerHTML = '<i class="fas fa-download"></i> 下载'; }, 2500);
                            }
                        }, delay);
                    });
                });

                // 编辑/删除
                document.querySelectorAll('.btn-edit-file').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        openFileModal('编辑资源', idx);
                    });
                });
                document.querySelectorAll('.btn-delete-file').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        if (confirm(`确定删除「${files[idx].name}」？`)) {
                            files.splice(idx, 1);
                            saveFiles();
                            renderFiles();
                        }
                    });
                });

                adminAddWrapper.classList.toggle('show', isAdmin);
            }

            function renderInstall() {
                if (installs.length === 0) {
                    installGrid.innerHTML =
                        `<div class="empty-state"><i class="fas fa-info-circle"></i><p>暂无安装指南，请管理员添加。</p></div>`;
                    return;
                }
                let html = '';
                installs.forEach((item, idx) => {
                    const stepsHtml = item.steps.map(s => `<li>${s}</li>`).join('');
                    html += `
                        <div class="install-card" data-index="${idx}">
                            <h4><i class="fas ${item.icon || 'fa-cube'}"></i> ${escapeHtml(item.title)}</h4>
                            <ol>${stepsHtml}</ol>
                            <div class="install-admin-controls ${isAdmin ? 'show' : ''}">
                                <button class="btn-edit-install" data-index="${idx}"><i class="fas fa-pen"></i> 编辑</button>
                                <button class="btn-delete-install" data-index="${idx}"><i class="fas fa-trash"></i> 删除</button>
                            </div>
                        </div>
                    `;
                });
                installGrid.innerHTML = html;

                // 编辑
                document.querySelectorAll('.btn-edit-install').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        openInstallModal('编辑安装说明', idx);
                    });
                });
                // 删除
                document.querySelectorAll('.btn-delete-install').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        if (confirm(`确定删除「${installs[idx].title}」？`)) {
                            installs.splice(idx, 1);
                            saveInstall();
                            renderInstall();
                        }
                    });
                });

                adminAddInstallWrapper.classList.toggle('show', isAdmin);
            }

            // ---------- 管理员 ----------
            function toggleAdmin() {
                if (!isAdmin) {
                    const pwd = prompt('请输入管理员密码 (默认: yuneng)');
                    if (pwd === 'yuneng') {
                        isAdmin = true;
                        adminToggleBtn.classList.add('admin-active');
                        adminToggleBtn.innerHTML = '<i class="fas fa-user-shield"></i> 退出管理';
                        renderFiles();
                        renderInstall();
                    } else if (pwd !== null) {
                        alert('密码错误');
                    }
                } else {
                    isAdmin = false;
                    adminToggleBtn.classList.remove('admin-active');
                    adminToggleBtn.innerHTML = '<i class="fas fa-user-shield"></i> 管理';
                    renderFiles();
                    renderInstall();
                }
            }
            adminToggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                toggleAdmin();
            });

            // ---------- 文件模态框 ----------
            function openFileModal(title, index) {
                fileModalTitle.textContent = title;
                fileEditIndex.value = index;
                if (index >= 0 && index < files.length) {
                    const f = files[index];
                    fileName.value = f.name || '';
                    fileVersion.value = f.version || '';
                    fileSize.value = f.size || '';
                    fileDesc.value = f.desc || '';
                    fileIcon.value = f.icon || 'fa-file';
                    fileExt.value = f.ext || '';
                } else {
                    fileName.value = '';
                    fileVersion.value = '';
                    fileSize.value = '';
                    fileDesc.value = '';
                    fileIcon.value = 'fa-file';
                    fileExt.value = '';
                }
                fileUpload.value = '';
                fileModal.classList.add('active');
            }
            function closeFileModal() { fileModal.classList.remove('active'); }
            fileModalCancel.addEventListener('click', closeFileModal);
            fileModal.addEventListener('click', function(e) { if (e.target === fileModal) closeFileModal(); });

            fileForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const name = fileName.value.trim();
                const desc = fileDesc.value.trim();
                if (!name || !desc) { alert('请填写资源名称和详细介绍'); return; }
                const idx = parseInt(fileEditIndex.value, 10);
                const newFile = {
                    name: name,
                    version: fileVersion.value.trim() || 'v1.0',
                    desc: desc,
                    size: fileSize.value.trim() || '未知',
                    icon: fileIcon.value.trim() || 'fa-file',
                    ext: fileExt.value.trim() || '文件',
                    fileName: name.replace(/\s/g, '_') + '_' + (fileVersion.value.trim() || 'v1.0') + '.' + (fileExt.value
                        .trim() || 'bin')
                };
                if (fileUpload.files.length > 0) {
                    const up = fileUpload.files[0];
                    newFile.fileName = up.name;
                    if (!fileSize.value.trim()) {
                        newFile.size = (up.size / (1024 * 1024)).toFixed(1) + ' MB';
                    }
                    if (!fileExt.value.trim()) {
                        newFile.ext = up.name.split('.').pop().toUpperCase() + ' 文件';
                    }
                }
                if (idx >= 0 && idx < files.length) {
                    files[idx] = newFile;
                } else {
                    files.push(newFile);
                }
                saveFiles();
                renderFiles();
                closeFileModal();
            });

            openAddFileBtn.addEventListener('click', function() {
                openFileModal('上传新资源', -1);
            });

            // ---------- 安装模态框 ----------
            function openInstallModal(title, index) {
                installModalTitle.textContent = title;
                installEditIndex.value = index;
                if (index >= 0 && index < installs.length) {
                    const item = installs[index];
                    installTitle.value = item.title || '';
                    installSteps.value = item.steps ? item.steps.join('\n') : '';
                } else {
                    installTitle.value = '';
                    installSteps.value = '';
                }
                installModal.classList.add('active');
            }
            function closeInstallModal() { installModal.classList.remove('active'); }
            installModalCancel.addEventListener('click', closeInstallModal);
            installModal.addEventListener('click', function(e) { if (e.target === installModal) closeInstallModal(); });

            installForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const title = installTitle.value.trim();
                const stepsRaw = installSteps.value.trim();
                if (!title || !stepsRaw) { alert('请填写标题和步骤'); return; }
                const steps = stepsRaw.split('\n').filter(s => s.trim() !== '');
                if (steps.length === 0) { alert('请至少填写一个步骤'); return; }
                const idx = parseInt(installEditIndex.value, 10);
                const newItem = {
                    title: title,
                    icon: 'fa-cube',
                    steps: steps
                };
                if (idx >= 0 && idx < installs.length) {
                    installs[idx] = newItem;
                } else {
                    installs.push(newItem);
                }
                saveInstall();
                renderInstall();
                closeInstallModal();
            });

            openAddInstallBtn.addEventListener('click', function() {
                openInstallModal('添加安装指南', -1);
            });

            // ---------- 初始化 ----------
            loadData();
            renderFiles();
            renderInstall();

            // 导航高亮
            const sections = document.querySelectorAll('section[id]');
            const navLinks = document.querySelectorAll('.nav-menu a:not(.nav-admin-btn)');

            function updateActiveLink() {
                const scrollPos = window.scrollY + 100;
                let currentId = 'home';
                sections.forEach(sec => {
                    const top = sec.offsetTop;
                    const height = sec.offsetHeight;
                    if (scrollPos >= top && scrollPos < top + height) currentId = sec.id;
                });
                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + currentId) link.classList.add('active');
                });
            }
            window.addEventListener('scroll', function() {
                requestAnimationFrame(updateActiveLink);
            });
            setTimeout(updateActiveLink, 150);

            // 移动端菜单
            const toggleBtn = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            let menuOpen = false;
            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                menuOpen = !menuOpen;
                navMenu.classList.toggle('open');
                toggleBtn.setAttribute('aria-expanded', menuOpen);
                toggleBtn.querySelector('i').className = menuOpen ? 'fas fa-times' : 'fas fa-bars';
            });
            navMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function() {
                    if (menuOpen) {
                        menuOpen = false;
                        navMenu.classList.remove('open');
                        toggleBtn.setAttribute('aria-expanded', 'false');
                        toggleBtn.querySelector('i').className = 'fas fa-bars';
                    }
                });
            });
            document.addEventListener('click', function(e) {
                if (menuOpen && !document.querySelector('.navbar').contains(e.target)) {
                    menuOpen = false;
                    navMenu.classList.remove('open');
                    toggleBtn.setAttribute('aria-expanded', 'false');
                    toggleBtn.querySelector('i').className = 'fas fa-bars';
                }
            });

            // 滚动阴影
            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', function() {
                navbar.classList.toggle('scrolled', window.scrollY > 20);
            });

        })();
    </script>

</body>
</html>
